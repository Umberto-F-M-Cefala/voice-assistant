<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#007bff">
<title>Assistente vocale di Umberto F. M. Cefalà</title>
<link rel="manifest" href="manifest.json"> 
<style>
  /* ================= STILI (Mobile Friendly REM) ================= */
  html { font-size: 100%; box-sizing: border-box; }
  *, *:before, *:after { box-sizing: inherit; }
  
  body { 
    font-family: Arial, sans-serif; 
    text-align: center; 
    padding: 1.25rem; 
    margin: 0;
    background-color: #fff;
  }
  
  /* Contenitore Bottoni Mic/Stop */
  .controls-container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 1rem;
  margin-bottom: 0.625rem;
  flex-wrap: wrap;
}

  /* Icona stato dinamica */
  #statusIconContainer {
      font-size: 2rem;
      margin-top: 0.5rem;
      min-height: 2.5rem;
  }

  /* Elenco Sezioni */
  #sectionsList {
      font-size: 0.9rem;
      color: #333;
      background-color: #e9ecef;
      padding: 0.5rem;
      border-radius: 0.3125rem;
      margin-top: 0.625rem;
      margin-bottom: 0.5rem;
      line-height: 1.4;
      border: 1px solid #ced4da;
  }

  /* Stile Bottoni Principali */
  #micButton {
  font-size: 3.75rem;
  width: 7.5rem;
  height: 7.5rem;
  border-radius: 50%;
  border: 0.3125rem solid #007bff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0.625rem;
  transition: background-color 0.2s, border-color 0.2s;
}
  #micButton:hover { background-color: #e2e6ea; }
  #micButton.listening { border-color: #dc3545; background-color: #fdf5f6; }

  #stopButton, #muteButton {
  font-size: 2.25rem;
  width: 5rem;
  height: 5rem;
  border-radius: 1rem;
  border-width: 0.1875rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0.625rem;
}
  
  #stopButton:hover { background-color: #fdf5f6; }

  /* Output Text Box */
  #output { 
    margin-top: 0.5rem; 
    white-space: pre-wrap; 
    text-align: left; 
    background: #f4f4f4; 
    padding: 0.625rem; 
    border-radius: 0.3125rem; 
    min-height: 9.375rem; 
    border: 1px solid #ccc;
    font-size: 1rem;
  }
  
  input, select, button { margin: 0.3125rem; padding: 0.3125rem; font-size: 1rem; }
  
  #toggleButtons {
    cursor: pointer; margin-top: 0.625rem; padding: 0.625rem; width: 12.5rem;
    border: 2px solid #6c757d; background-color: #f8f9fa; border-radius: 0.3125rem;
    font-weight: bold; font-size: 1.125rem;
  }

  #extraButtons {
    display: none; border: 1px solid #ccc; border-radius: 0.3125rem; padding: 0.625rem;
    margin-top: 0.3125rem; max-width: 25rem; margin-left: auto; margin-right: auto;
    background-color: #fff;
  }


/* modalità disattivata */
#muteButton.mute-off {
    background-color: #e9ecef;
    border-color: #6c757d;
    color: #6c757d;
}

  button:active {
  transform: scale(0.95);
  box-shadow: 0 0 5px rgba(0,0,0,0.2);
  }

#micButton {
  box-shadow: 0 4px 6px rgba(0, 123, 255, 0.3);
}
  #stopButton {
  border: 0.1875rem solid #dc3545;
  background: #fff;
  color: #dc3545;
}

#muteButton {
  border: 0.1875rem solid #6c757d;
  background: #fff;
  color: #6c757d;
}

@media (max-width: 480px) {
  #micButton { width: 5.5rem; height: 5.5rem; font-size: 2.8rem; }
  #stopButton, #muteButton { width: 4rem; height: 4rem; font-size: 1.8rem; }
    }
  
</style>
</head>
<body>

<div class="controls-container"> 
<button id="micButton" aria-label="Avvia registrazione vocale">🎙️</button>
<button id="stopButton" aria-label="Ferma tutto">⏹️</button>
<button id="muteButton" aria-label="Attiva/Disattiva audio">🔈</button>
</div>

<div id="sectionsList">Caricamento sezioni...</div>

<div id="statusIconContainer"></div>
<div id="output"></div>

<button id="toggleButtons">⬇️ Opzioni</button>
<div id="extraButtons">
  <button id="infoArchive">Informazioni Archivio</button> 
  <button id="infoCommands">Informazioni Comandi</button> 
  <button id="exportCommands">Esporta Archivio</button>
  <input type="file" id="importFile" accept=".json">
  <button id="resetArchive">Reset Archivio</button>
</div>

<script>
/* ================== CONFIG E STATO ================== */
const defaultArchive = { "conversazione": [], "rubrica": [] }; // Aggiunta rubrica come default
let archive = JSON.parse(localStorage.getItem('archive') || JSON.stringify(defaultArchive));

let appState = "IDLE"; 
let tempMemory = {}; 
let lastMainOutput = ""; 
let currentRecognition = null; 
const SIGNATURE_TEXT = " - - testo trascritto dall'assistente vocale.";
let lastInterimResult = "";
let audioEnabled = true; // output vocale attivo di default
  
// Vocabolario
const copyWords = ["copia", "salva", "trascrivi", "conserva", "riporta", "tieni"];
const affirmativeWords = ["sì", "va bene", "ok", "conferma", "esatto", "tutti", "tutto"];
const negativeWords = ["no", "cancella", "rimuovi", "annulla", "nessuno", "basta"];
const searchVerbs = ["cerca", "cerchi", "trova", "trovi", "dimmi", "dici"];
const searchPreps = ["in", "nelle", "nei", "nello", "nella", "su", "sulle", "sui", "sullo", "sulla"];
const readWords = ["leggi", "recita", "esponi"];
const randomWords = ["random", "a caso", "casuale"];
const whatsappWords = ["invia", "manda", "spedisci"]; 

// Mappa Emoji
const emojiMap = {
    "cuore": "❤️",
    "sorriso": "🙂",
    "risata": "😂",
    "ok": "👌",
    "pollice su": "👍",
    "pollice giù": "👎",
    "fuoco": "🔥",
    "stella": "⭐",
    "sole": "☀️",
    "luna": "🌙",
    "bacio": "😘",
    "abbraccio": "🤗",
    "festa": "🎉",
    "tort": "🎂", // prende torta
    "regalo": "🎁",
    "musica": "🎵",
    "occhiolino": "😉",
    "triste": "😢",
    "arrabbiato": "😡",
    "pensoso": "🤔",
    "applauso": "👏",
    "preghiera": "🙏",
    "forza": "💪",
    "bomba": "💣",
    "attenzione": "⚠️",
    "spunta": "✅",
    "croce": "❌",
    "fantasma": "👻",
    "robot": "🤖",
    "alieno": "👽"
};

/* ================== MAPPA NUMERI ================== */
let textToNumMap = {
    "un": 1, "uno": 1, "primo": 1,
    "due": 2, "secondo": 2,
    "tre": 3, "terzo": 3,
    "quattro": 4, "quarto": 4,
    "cinque": 5, "quinto": 5,
    "sei": 6, "sesto": 6,
    "sette": 7, "settimo": 7,
    "otto": 8, "ottavo": 8,
    "nove": 9, "nono": 9,
    "dieci": 10, "decimo": 10,
    "cento": 100
};

/* ================== FUNZIONE PER RILASCIARE RISORSE ================== */
function releaseResources(fullyStop = true) {
    try { speechSynthesis.cancel(); } catch(e) {}

    if (currentRecognition) {
        try {
            const r = currentRecognition;
            if(fullyStop) currentRecognition = null;
            
            // Rimuovo callback per evitare riavvii indesiderati se stoppo tutto
            if(fullyStop) r.onend = null;
            
            r.stop();
        } catch(e) {}
    }

    if(fullyStop) {
        appState = "IDLE";
        tempMemory = {};
        document.getElementById('micButton').classList.remove('listening');
    }

    if (inactivityTimer) {
        clearTimeout(inactivityTimer);
        inactivityTimer = null;
    }
}


let inactivityTimer = null;
const INACTIVITY_TIMEOUT = 15000; // 15 secondi

function stopAllActivities() {
    releaseResources(true);
    lastMainOutput = "";
    appendOutput("Bot: Timeout inattività, microfono e TTS fermati.");
}

function resetInactivityTimer() {
    if (inactivityTimer) clearTimeout(inactivityTimer);
    inactivityTimer = setTimeout(() => {
        stopAllActivities();
    }, INACTIVITY_TIMEOUT);
}
  
function populateNumberMap() {
    const units = ["", "uno", "due", "tre", "quattro", "cinque", "sei", "sette", "otto", "nove"];
    const tens = ["", "dieci", "venti", "trenta", "quaranta", "cinquanta", "sessanta", "settanta", "ottanta", "novanta"];
    const specials = ["dieci", "undici", "dodici", "tredici", "quattordici", "quindici", "sedici", "diciassette", "diciotto", "diciannove"];

    for (let i = 1; i < 100; i++) {
        let word = "";
        if (i < 10) continue; 
        else if (i >= 10 && i < 20) word = specials[i - 10];
        else {
            let t = Math.floor(i / 10);
            let u = i % 10;
            let tenWord = tens[t];
            let unitWord = units[u];
            if ((u === 1 || u === 8) && tenWord.length > 0) tenWord = tenWord.substring(0, tenWord.length - 1);
            word = tenWord + unitWord;
        }
        textToNumMap[word] = i;
        if (word.endsWith("tre")) textToNumMap[word.replace("tre", "tré")] = i;
    }
}
populateNumberMap();

/* ================== GESTIONE UI SEZIONI ================== */
function updateSectionList() {
    const listDiv = document.getElementById('sectionsList');
    const sections = Object.keys(archive);
    
    if (sections.length === 0) {
        listDiv.textContent = "Elenco delle sezioni: Nessuna sezione presente";
        return;
    }

    const labels = sections.map(sec => {
        const count = Array.isArray(archive[sec]) ? archive[sec].length : 0;
        return `${sec} (n. ${count})`;
    });

    listDiv.textContent = "Elenco delle sezioni: " + labels.join(" - ");
}
updateSectionList();

/* ================== HELPER VISUALIZZAZIONE ================== */
function setStatusIcon(type) {
    const container = document.getElementById('statusIconContainer');
    let icon = "";
    let label = "";
    switch(type) {
        case 'search': icon = "🔍"; label = "Ricerca"; break;
        case 'conversation': icon = "💬"; label = "Conversazione"; break;
        case 'random': icon = "📖"; label = "Lettura Random"; break;
        case 'transcription': icon = "🪶"; label = "Trascrizione"; break;
        case 'whatsapp': icon = "📱"; label = "WhatsApp"; break;
        default: icon = ""; 
    }
    container.innerHTML = icon ? `${icon} <span style="font-size:1rem; vertical-align:middle">${label}</span>` : "";
}

function appendOutput(text) {
  const outDiv = document.getElementById('output');
  outDiv.textContent += text + "\n";
  outDiv.scrollTop = outDiv.scrollHeight;
}

function displayEntryDetails(item) {
    const out = `----------------
ricerca: ${item.trigger || "N/A"}
contenuto: ${item.output || "N/A"}
tag: ${item.tag || "-"}
titolo: ${item.meta_title || "-"}
autore: ${item.meta_author || "-"}
----------------`;
    appendOutput(out);
}

/* ================== FUNZIONI VOCALI ================== */
function speak(text, onEndCallback = null, isEntry = false) {

  if (!audioEnabled) { 
      if (!isEntry) appendOutput("Bot (muto): " + text);
      if (onEndCallback) onEndCallback();
      return;
  }

  // Importante: Cancella precedenti utterance per evitare code lunghe
  speechSynthesis.cancel();
  
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'it-IT';
  
  if (!isEntry) appendOutput("Bot: " + text);
  
  if (onEndCallback) {
      utter.onend = onEndCallback;
  }
  
  speechSynthesis.speak(utter);
}


function speakEntry(item) {
    speak(item.output, null, true);
}

/* ================== CONTROLLI PRINCIPALI ================== */

function activateListening() {
    // 1. Ferma TTS
    if (speechSynthesis.speaking) speechSynthesis.cancel();

    // 2. Stop microfono precedente
    if (currentRecognition) {
        currentRecognition.onend = null;
        currentRecognition.stop();
        currentRecognition = null;
    }

    // 3. Avvia
    startListening(handleSpeech);
}

document.getElementById('micButton').onclick = () => {
    const micBtn = document.getElementById('micButton');

    if (appState === "LISTENING" || micBtn.classList.contains('listening')) {
        // Stop manuale
        micBtn.classList.remove('listening');
        appState = "IDLE";
        
        if (currentRecognition) {
            currentRecognition.stop(); 
            // Nota: onend gestirà la chiusura o l'invio del testo parziale
        }
        appendOutput("Ascolto interrotto manualmente.");
        return;
    }

    activateListening();
    appState = "LISTENING";
};

// Shortcut Ctrl + Alt + v
document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'v') {
        e.preventDefault(); 
        const micBtn = document.getElementById('micButton');
        micBtn.click();
    }
});

document.getElementById('stopButton').onclick = () => {
    stopAllActivities(); // Resetta tutto
    document.getElementById('output').textContent = "";
    setStatusIcon("");
};

  
function startListening(callback) {
    if (!('webkitSpeechRecognition' in window)) {
        appendOutput("ERRORE: Riconoscimento vocale non supportato.");
        return;
    }

    const mic = document.getElementById('micButton');
    mic.classList.add('listening');

    const r = new webkitSpeechRecognition();
    currentRecognition = r;

    r.lang = "it-IT";
    r.interimResults = true;
    r.maxAlternatives = 1;

    lastInterimResult = "";

    r.onresult = (event) => {
        const text = event.results[0][0].transcript.toLowerCase();
        lastInterimResult = text;

        if (event.results[0].isFinal) {
            lastInterimResult = "";
            callback(text);
        }
    };

    r.onerror = event => {
        // Ignora "no-speech" se stiamo aspettando una scelta, altrimenti notifica
        if (event.error !== 'no-speech') {
             appendOutput("Errore Mic: " + event.error);
        }
    };

    r.onend = () => {
        mic.classList.remove('listening');
        currentRecognition = null;

        // LOGICA CRITICA PER FLUSSI CONCATENATI
        // Se siamo in attesa di scelta, potrebbe essersi chiuso per silenzio.
        // Ma non riavviamo all'infinito per la batteria. 
        // L'utente deve ripremere se passa troppo tempo, 
        // OPPURE se è appena finito un TTS di prompt, si deve riattivare da solo.
        
        // Qui gestiamo solo cleanup. Il riavvio automatico è gestito dalla callback del TTS in processSearchResults
    };

    r.start();
    resetInactivityTimer();
    appendOutput("...In ascolto...");
}


/* ================== LOGICA CENTRALE ================== */

function handleSpeech(text) {
  appendOutput("Tu: " + text);
  resetInactivityTimer();
  
  // GESTIONE INPUT CONCATENATO (SCELTA RISULTATI)
  if (appState === "AWAITING_SEARCH_CHOICE") {
      handleSearchChoice(text);
      return;
  }

  // 1. COMANDI DI SISTEMA
  if (text === "ripeti") {
      if (lastMainOutput) speak("Ripeto: " + lastMainOutput);
      else speak("Non c'è nulla da ripetere.");
      return;
  }

  // 2. WHATSAPP (Priorità alta)
  if (whatsappWords.some(w => text.startsWith(w))) {
      setStatusIcon('whatsapp');
      handleWhatsapp(text);
      return;
  }

  // 3. COPIA DIRETTA / TRASCRIZIONE
  const commandWord = copyWords.find(w => text.startsWith(w));
  if (commandWord) {
      setStatusIcon('transcription');
      handleCopyCommand(text, commandWord);
      return;
  }

  // 4. LETTURA LOOP / RANDOM
  if (readWords.some(w => text.startsWith(w))) {
      setStatusIcon('random');
      if (handleRead(text)) return;
  }

  // 5. RICERCA METADATI
  if (text.includes("autore") || text.includes("titolo")) {
      setStatusIcon('search');
      let type = text.includes("autore") ? "meta_author" : "meta_title";
      let splitter = text.includes("autore") ? "autore" : "titolo";
      let query = text.split(splitter)[1].trim();
      if (query) {
          handleMetadataSearch(type, query);
          return;
      }
  }

  // 6. RICERCA AVANZATA (Cerca in...)
  const searchPattern = new RegExp(`(${searchVerbs.join('|')})\\s+(${searchPreps.join('|')})\\s+([a-zA-Z0-9_]+)\\s+(.*)`, 'i');
  const match = text.match(searchPattern);
  if (match) {
      setStatusIcon('search');
      const section = match[3].toLowerCase();
      const query = match[4].trim();
      if (archive[section]) {
          handleAdvancedSearch(section, query);
          return;
      } else {
          speak(`La sezione "${section}" non esiste.`);
          return;
      }
  }

  // 7. RICERCA DIRETTA (Trigger puro)
  // Cerca in tutte le sezioni, priorità a conversazione
  let found = null;
  // Prima conversazione
  if (archive.conversazione) {
      found = archive.conversazione.find(cmd => text.includes(cmd.trigger.toLowerCase()));
  }
  // Se non trovato, cerca altrove
  if (!found) {
      for (let sec in archive) {
          if (sec === "conversazione") continue;
          found = archive[sec].find(cmd => text.includes(cmd.trigger.toLowerCase()));
          if (found) break;
      }
  }

  if (found) {
      setStatusIcon('conversation');
      displayEntryDetails(found);
      speakEntry(found);
      lastMainOutput = found.output; 
      return;
  }

  // 8. NON RICONOSCIUTO
  lastMainOutput = text;
  setStatusIcon('');
  appendOutput("(Testo non riconosciuto. Dì 'Salva', 'Ripeti' o 'Invia a...')");
}

/* ================== IMPLEMENTAZIONE FUNZIONI ================== */

// Helper formattazione testo (maiuscole ed emoji)
function formatText(str) {
    let s = str;

    // 1. Sostituzione Emoji (es: "emoji cuore")
    s = s.replace(/emoji\s+(\w+(\s\w+)?)/gi, (match, p1) => {
        let key = p1.toLowerCase().trim();
        return emojiMap[key] ? emojiMap[key] : match;
    });

    // 2. Maiuscola dopo i punti (. ! ?) e all'inizio assoluto
    // Regex: trova inizio stringa O punteggiatura seguita da spazi, poi un carattere
    s = s.replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase());

    return s;
}

function parseNumber(text) {
    if (!text) return null;
    let t = text.toLowerCase().trim().replace(/[^\wàèéìòù0-9 ]+/g, "");
    
    // Cifra
    const digitMatch = t.match(/\d+/);
    if (digitMatch) return parseInt(digitMatch[0]);

    // "numero 5"
    const afterNumero = t.match(/numero\s+(\d+)/);
    if (afterNumero) return parseInt(afterNumero[1]);

    // Parole
    for (const [word, value] of Object.entries(textToNumMap)) {
        if (t === word || t.includes(word)) return value; 
    }
    return null;
}

// Integrazione WhatsApp
function handleWhatsapp(text) {
    // Regex: invia [a/al/...] [nome] [messaggio]
    // Strategia: togliamo il comando iniziale, poi cerchiamo il contatto più lungo corrispondente
    let cleanText = text.replace(/^(invia|manda|spedisci)\s+(a|al|allo|alla)\s+/i, "").trim();
    
    if (!cleanText) {
        speak("A chi devo inviare?");
        return;
    }

    // Cerchiamo un contatto che corrisponda all'inizio della stringa
    let bestMatch = null;
    let bestLen = 0;
    let messageBody = "";

    // Scansiona tutto l'archivio
    for (let sec in archive) {
        archive[sec].forEach(item => {
            let trg = item.trigger.toLowerCase();
            if (cleanText.startsWith(trg)) {
                if (trg.length > bestLen) {
                    bestLen = trg.length;
                    bestMatch = item;
                }
            }
        });
    }

    if (bestMatch) {
        // Estrai il messaggio (tutto ciò che c'è dopo il nome)
        messageBody = cleanText.substring(bestLen).trim();
        // Capitalizza il messaggio
        if (messageBody) messageBody = formatText(messageBody);

        let number = bestMatch.output.replace(/[^0-9+]/g, ""); // Pulisci numero
        
        if (!messageBody) {
             speak(`Contatto ${bestMatch.trigger} trovato, ma il messaggio è vuoto.`);
             return;
        }

        speak(`Apro WhatsApp per ${bestMatch.trigger}.`);
        appendOutput(`Bot: Apro WA per ${bestMatch.trigger} (${number}) con: "${messageBody}"`);
        
        setTimeout(() => {
            window.open(`https://wa.me/${number}?text=${encodeURIComponent(messageBody)}`, '_blank');
        }, 1500);

    } else {
        speak("Contatto non trovato nell'archivio.");
    }
}


function handleCopyCommand(text, commandWord) {
    let content = text.substring(commandWord.length).trim();
    
    // Firma
    let useSignature = false;
    if (content.includes("con firma") || content.includes("aggiungi firma")) {
        useSignature = true;
        content = content.replace(/con firma|aggiungi firma/gi, "").trim();
    }
    
    if (!content && lastMainOutput) content = lastMainOutput;
    else if (!content) { speak("Non c'è nulla da salvare."); return; }

    // Sostituzione Punteggiatura vocale
    content = content.replace(/\bvirgola\b/gi, ",")
                     .replace(/\bpunto\b/gi, ".")
                     .replace(/\bdue punti\b/gi, ":")
                     .replace(/\bpunto e virgola\b/gi, ";")
                     .replace(/\bpunto esclamativo\b/gi, "!")
                     .replace(/\bpunto interrogativo\b/gi, "?")
                     .replace(/\ba capo\b/gi, "\n");

    // Applicazione Formattazione Avanzata (Maiuscole + Emoji)
    content = formatText(content);

    // Pulizia spazi
    content = content.replace(/\s+([,.:;!?])/g, '$1'); // via spazi pre-punteggiatura
    content = content.replace(/([,.:;!?])\s*/g, '$1 '); // spazio post-punteggiatura
    content = content.replace(/\s\s+/g, ' ').trim();

    const finalString = useSignature ? content + SIGNATURE_TEXT : content;
    
    navigator.clipboard.writeText(finalString).then(() => {
        speak(useSignature ? "Salvato con firma." : "Salvato.");
        appendOutput(`📋 Appunti: "${finalString}"`);
        lastMainOutput = content;
    });
}

function handleRead(text) {
    if (text.includes("casuale")) {
        const allEntries = [].concat(...Object.values(archive));
        if(allEntries.length === 0) { speak("Archivio vuoto."); return true; }
        const item = allEntries[Math.floor(Math.random() * allEntries.length)];
        displayEntryDetails(item);
        speakEntry(item);
        return true;
    }
    
    const sectionMatch = Object.keys(archive).find(sec => text.includes(sec));
    if (sectionMatch) {
        const list = archive[sectionMatch];
        if (!list || list.length === 0) {
            speak(`La sezione ${sectionMatch} è vuota.`);
            return true;
        }
        
        speak(`Leggo ${sectionMatch}.`);
        
        let index = 0;
        function speakNext() {
            if (index >= list.length || appState !== "LISTENING") return; // Stop se l'utente ferma
            
            const item = list[index];
            displayEntryDetails(item);
            
            speak(item.output, () => {
                index++;
                if (index < list.length) speakNext();
            });
        }
        // Piccola pausa prima di iniziare
        setTimeout(speakNext, 1000);
        return true;
    }
    return false;
}

function handleAdvancedSearch(section, query) {
    const list = archive[section];
    if (!list) { speak("Sezione inesistente."); return; }
    
    const isRandom = randomWords.some(w => query.includes(w));
    if (isRandom) {
        const item = list[Math.floor(Math.random() * list.length)];
        displayEntryDetails(item);
        speakEntry(item);
        return;
    }
    const results = list.filter(c => 
        (c.trigger && c.trigger.toLowerCase().includes(query)) || 
        (c.output && c.output.toLowerCase().includes(query))
    );
    processSearchResults(results, `in ${section} per "${query}"`);
}

function handleMetadataSearch(type, query) {
    const all = [].concat(...Object.values(archive));
    const results = all.filter(c => c[type] && c[type].toLowerCase().includes(query));
    const vocalLabel = type === "meta_author" ? "autore" : "titolo";
    processSearchResults(results, `per ${vocalLabel} "${query}"`);
}

// LOGICA CRUCIALE PER INPUT CONCATENATI (FIX)
function processSearchResults(results, context) {
    if (results.length === 0) {
        speak("Nessun risultato " + context);
    } else if (results.length === 1) {
        displayEntryDetails(results[0]);
        speakEntry(results[0]);
        lastMainOutput = results[0].output;
    } else {
        // Risultati Multipli
        let listStr = `Trovati ${results.length} risultati. `;
        results.forEach((r, i) => {
            const title = r.meta_title || r.trigger || "Elemento";
            listStr += `${i + 1}: ${title}. `; 
        });
        
        appendOutput("Risultati multipli:\n" + listStr);
        tempMemory.searchResults = results;
        appState = "AWAITING_SEARCH_CHOICE"; // Imposta stato PRIMA di parlare

        // Parla, poi riattiva microfono
        speak(listStr + " Scegli il numero.", () => {
            // Callback: eseguito quando il TTS finisce
            // Riattiva mic SOLO se siamo ancora in attesa
            if (appState === "AWAITING_SEARCH_CHOICE") {
                appendOutput("...Attendo scelta numero...");
                startListening(handleSpeech);
            }
        });
    }
}

function handleSearchChoice(text) {
    // Uscita
    if (negativeWords.some(w => text.includes(w))) {
        speak("Annullato.");
        appState = "IDLE";
        tempMemory = {};
        return;
    }

    const results = tempMemory.searchResults;
    if (!results) { appState = "IDLE"; return; }

    // "Tutti"
    if (text.includes("tutti") || text.includes("tutto")) {
        speak(`Leggo tutto.`);
        appState = "IDLE"; // Reset stato per evitare loop
        
        let idx = 0;
        function playNext() {
            if (idx >= results.length) return;
            const item = results[idx];
            displayEntryDetails(item);
            speak(`Numero ${idx+1}. ` + item.output, () => {
                idx++;
                playNext();
            });
        }
        playNext();
        return;
    }
    
    // Scelta numero
    const choiceNum = parseNumber(text);
    if (choiceNum !== null && choiceNum > 0 && choiceNum <= results.length) {
        const item = results[choiceNum - 1];
        displayEntryDetails(item);
        speakEntry(item);
        lastMainOutput = item.output;
        appState = "IDLE";
    } else {
        // Se non ho capito, chiedo di ripetere (loop controllato)
        speak("Numero non valido, ripeti o dì annulla.", () => {
             if (appState === "AWAITING_SEARCH_CHOICE") startListening(handleSpeech);
        });
    }
}

  const a = document.createElement('a');

  a.download = "archivio_assistente.json";

document.getElementById('importFile').onchange = (e) => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const json = JSON.parse(ev.target.result);
      for(let k in json) {
          if (!archive[k]) archive[k] = [];
          json[k].forEach(item => archive[k].push(item));
      }
      localStorage.setItem('archive', JSON.stringify(archive));
      updateSectionList(); 
      appendOutput(`Bot: Importazione completata.`);
    } catch(err) { appendOutput("Errore JSON: " + err.message); }
  };
  reader.readAsText(file);
};

document.getElementById('resetArchive').onclick = () => {
  if(confirm("Reset archivio?")) {
    archive = JSON.parse(JSON.stringify(defaultArchive));
    localStorage.setItem('archive', JSON.stringify(archive));
    updateSectionList(); 
    appendOutput("Bot: Archivio resettato.");
  }
};

function updateMuteButtonUI() {
    if (audioEnabled) {
        muteButton.textContent = "🔈"; 
        muteButton.classList.remove('mute-off');
        muteButton.classList.add('mute-on');
    } else {
        muteButton.textContent = "🔇"; 
        muteButton.classList.remove('mute-on');
        muteButton.classList.add('mute-off');
    }
}

    audioEnabled = !audioEnabled;
    updateMuteButtonUI();
    appendOutput("Bot: Audio " + (audioEnabled ? "attivo" : "disattivato"));
};
