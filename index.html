function stopAllAudio() {
    speechSynthesis.cancel();
    synthesisQueue = [];
}

function speak(text) {
    stopAllAudio();
    if (!audioEnabled || !text) return;
    
    // Divide testo lungo per evitare blocchi su Android
    const chunks = text.match(/.{1,160}(\s|$)/g) || [text];
    
    let i = 0;
    function playNext() {
        if (i >= chunks.length) return;
        const u = new SpeechSynthesisUtterance(chunks[i]);
        u.lang = 'it-IT';
        u.onend = () => { i++; playNext(); };
        u.onerror = () => { i++; playNext(); };
        speechSynthesis.speak(u);
    }
    playNext();
}

/* ================== MICROFONO & CORE LOGIC ================== */

const micBtn = document.getElementById('micButton');

function setState(newState) {
    appState = newState;
    micBtn.classList.remove('listening');
    if (newState === STATES.LISTENING) micBtn.classList.add('listening');
    
    // Reset icona se torniamo in IDLE
    if (newState === STATES.IDLE) document.getElementById('statusIconContainer').textContent = "";
}

function startListening() {
    if (currentRecognition) currentRecognition.abort();
    if (!('webkitSpeechRecognition' in window)) return alert("Usa Chrome.");

    const r = new webkitSpeechRecognition();
    r.lang = "it-IT";
    r.interimResults = false;
    r.maxAlternatives = 1;

    r.onstart = () => {
        setState(STATES.LISTENING);
        flashScreen('rgba(220,53,69,0.6)'); // rosso
        appendOutput("⏳ Attendo istruzioni", "temp-status");
    };

    r.onresult = (e) => {
        const text = e.results[0][0].transcript.toLowerCase().trim();
        document.querySelectorAll('.temp-status').forEach(el => el.remove());
        handleSpeechInput(text);
    };

    r.onerror = (e) => {
        if (e.error !== 'no-speech') appendOutput("⚠️ Errore microfono: " + e.error);
        setState(STATES.IDLE);
    };

    r.onend = () => {
        // Se non stiamo processando, torna in IDLE
        if (appState === STATES.LISTENING) setState(STATES.IDLE);
    };

    currentRecognition = r;
    r.start();
}

micBtn.onclick = () => {
   if (appState === STATES.SPEAKING || speechSynthesis.speaking) {
        stopAllAudio();
        startListening();
        return;
    }
   if (appState === STATES.LISTENING) {
        if (currentRecognition) currentRecognition.stop();
        return;
    }
    startListening();
};
 

document.getElementById('stopButton').onclick = () => {

    stopAllAudio();

    if (currentRecognition) {
        currentRecognition.onend = null; // evita ri-trigger

            currentRecognition.abort(); // più rapido e sicuro
        } catch (e) {

        }

// \u0055\u006D\u0062\u0065\u0072\u0074\u006F \u0046\u002E \u004D\u002E \u0043\u0065\u0066\u0061\u006C\u00E0
function formatText(str, autoEmoji) {
    let s = str.trim();

    // 1. Emoji Automatiche (Solo se richiesto)
    if (autoEmoji) {
        // Sostituisce le parole intere presenti nella mappa
        const regex = new RegExp(`\\b(${Object.keys(emojiMap).join("|")})\\b`, "gi");
        s = s.replace(regex, (match) => emojiMap[match.toLowerCase()] || match);
    }

  // Punteggiatura vocale → simboli
    const punctuationMap = [
        { regex: /\bpunto interrogativo\b/gi, char: "?" },
        { regex: /\bpunto esclamativo\b/gi, char: "!" },
        { regex: /\bdue punti\b/gi, char: ":" },
        { regex: /\bvirgola\b/gi, char: "," },
        { regex: /\bpunto\b/gi, char: "." },
        { regex: /\ba capo\b/gi, char: "\n" }
    ];

    for (const p of punctuationMap) {
        s = s.replace(p.regex, p.char);
    }

    // Capitalizzazione frasi
    s = s.replace(/(^|[.!?]\s+)([a-z])/g, (m, before, char) => before + char.toUpperCase());

    // Capitalizzazione NOMI ITALIANI
    const nomiRegex = new RegExp(`\\b(${[...NOMI_ITALIANI].join("|")})\\b`, "gi");
    s = s.replace(nomiRegex, m => m.charAt(0).toUpperCase() + m.slice(1));

    // Capitalizzazione CITTA ITALIANE
    const cittaRegex = new RegExp(`\\b(${[...CITTA_ITALIANE]
        .sort((a,b)=>b.length-a.length) // evita match parziali (es: "terme" in "Lamezia Terme")
        .join("|")
        .replace(/\s+/g, "\\s+")})\\b`, "gi");

    // Formattazione del saluto (Buongiorno/Ciao/Buonasera + nomi)
    s = s.replace(
    /\b(Buongiorno|Ciao|Buonasera)\s+((?:[A-Z][a-z]+(?:\s+)?)+)/g,
    (m, saluto, nomi) => {
        nomi = nomi.trim();
        return `${saluto} ${nomi},\n`;
    }
   );
  //Formattazione più vocativo
   s = s.replace(
    /\b(Buongiorno|Ciao|Buonasera)\s+(mia bella|mie belle|cara)(?:\s+([A-Z][a-z]+))?/g,
    (m, saluto, vocativo, nome) => {
        const full = nome ? `${vocativo} ${nome}` : vocativo;
        return `${saluto} ${full},\n`;
    }
    );
  
    s = s.replace(cittaRegex, m =>
        m.split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ")
    );

// Normalizzazione spazi e punteggiatura
    s = s.replace(/\s+([,.!?])/g, "$1");  // niente spazio prima della punteggiatura
    s = s.replace(/([,.!?])(?=\S)/g, "$1 "); // assicura spazio dopo punteggiatura (tranne prima di newline)
    s = s.replace(/([,.!?])\s+\n/g, "$1\n"); // niente spazio prima delle newline
    s = s.replace(/\s*\n\s*/g, "\n");
  
  
 return s;
  
}

// Logica di Ricerca

function handleSearchCommand(text) {
    const words = text.trim().split(/\s+/);
    
    if (!words.length || words[0].toLowerCase() !== "cerca") return null;

    let section = null;
    let field = "trigger";
    let queryStartIndex = 1; // l'indice da cui inizia la query

    // cerchiamo la sezione: prima parola dopo "cerca" che non sia "autore" o "titolo"
    for (let i = 1; i < words.length; i++) {
        const w = words[i].toLowerCase();
        if (w !== "autore" && w !== "titolo") {
            section = w;
            queryStartIndex = i + 1;
            break;
        }
    }

    // cerchiamo il campo (autore/titolo) dopo la sezione
    for (let i = queryStartIndex; i < words.length; i++) {
        const w = words[i].toLowerCase();
        if (w === "autore" || w === "titolo") {
            field = w;
            queryStartIndex = i + 1;
            break;
        }
    }

    // la query è tutto ciò che rimane dopo sezione e campo
    const query = words.slice(queryStartIndex).join(" ").trim();

    if (!query) return null;

    return { section, field, query };
}

  
function findBestMatchInSection(query, section) {
    let best = null;
    let maxScore = 0;
    const q = query.toLowerCase().trim();

    if (!archive[section]) return { item: null, score: 0 };

    archive[section].forEach(item => {
        ["trigger", "meta_title", "meta_author"].forEach(field => {
            const value = (item[field] || "").toLowerCase();
            const score = fuzzyScore(q, value);
            if (score > maxScore) {
                maxScore = score;
                best = item;
            }
        });
    });

    return { item: best, score: maxScore };
}

function fuzzyScore(query, text) {
    query = query.normalize("NFD").replace(/\p{Diacritic}/gu, "");
    text = text.normalize("NFD").replace(/\p{Diacritic}/gu, "");

    if (!text) return 0;
    if (query === text) return 1.0;
    if (text.includes(query)) return 0.9;
    if (query.includes(text) && text.length > 3) return 0.7;
    return 0;
}

//  Ricerca con punteggio e flessibilità
function searchArchive(query, fields = ["trigger"], section = null) {
    let results = [];
    const qRaw = query.toLowerCase().trim();
    const tokens = qRaw.split(/\s+/).filter(t => t.length > 2); 

    const sectionsToSearch = section ? [section] : Object.keys(archive);

    sectionsToSearch.forEach(sec => {
        archive[sec].forEach(item => {
            let maxItemScore = 0;

            for (let f of fields) {
                const val = (item[f] || "").toLowerCase();
                let score = 0;

                // 1. Corrispondenza Esatta (Massima priorità)
                if (val === qRaw) {
                    score = 100;
                }
                // 2. Inizia con la query
                else if (val.startsWith(qRaw)) {
                    score = 80;
                }
                // 3. Contiene la frase esatta
                else if (val.includes(qRaw)) {
                    score = 60;
                }
                // 4. Ricerca flessibile (contiene tutti i token sparsi)
                else if (tokens.length > 0 && tokens.every(t => val.includes(t))) {
                    score = 40;
                }

                if (score > maxItemScore) maxItemScore = score;
            }

            if (maxItemScore > 0) {
                // Aggiungiamo un flag score per l'ordinamento
                results.push({ ...item, section: sec, searchScore: maxItemScore });
            }
        });
    });

    // Ordina per punteggio decrescente (i match migliori per primi)
    results.sort((a, b) => b.searchScore - a.searchScore);

    return results;
}

function handleSearchResults(results, query) {
    if (results.length === 0) {
        speak("Nessun risultato. Vuoi salvare questo testo?");
        appendOutput(`Nessun risultato per "${query}". Lo devo salvare in appunti?`);
        tempMemory.pendingText = query;
        setState(STATES.AWAITING_CONFIRM);
    } else if (results.length === 1) {
        // Un solo risultato: mostriamo direttamente
        displayEntry(results[0]);
        flashScreen('rgba(40,167,69,0.6)'); // verde
        speak(results[0].output);
        lastMainOutput = results[0].output;
        setState(STATES.IDLE);
    } else {
        tempMemory.results = results;
        
        // Visualizzazione elenco raggruppato
        const resultsBySection = {};
        results.forEach(r => {
            const sec = r.section || "Generale";
            if (!resultsBySection[sec]) resultsBySection[sec] = [];
            resultsBySection[sec].push(r);
        });

        let list = "";
        let globalCounter = 1; // Contatore unico per permettere la selezione

        for (let sec in resultsBySection) {
            list += `\n--- ${sec.toUpperCase()} ---\n`;
            resultsBySection[sec].forEach(item => {
                // Usiamo il titolo o il trigger, e mostriamo un'anteprima score se utile debug
                list += `${globalCounter}. ${item.meta_title || item.trigger}\n`;
                globalCounter++;
            });
        }

        flashScreen('rgba(255,193,7,0.6)'); // giallo
        appendOutput(`📋 Trovati ${results.length} risultati:${list}\n\n  Dimmi il numero di quello che vuoi aprire.`);
        speak(`Ho trovato ${results.length} risultati. Dimmi il numero di quello che vuoi aprire.`);
        setState(STATES.AWAITING_CHOICE);
    }
}

function handleChoiceInput(text) {
    // Gestione annullamento
    if (text.includes("annulla") || text.includes("basta") || text.includes("stop")) {
        speak("Operazione annullata.");
        appendOutput("Ricerca terminata.");
        return setState(STATES.IDLE);
    }

    let num = parseInt(text.replace(/\D/g, ''));
    if (isNaN(num)) {
        // Fallback su mappa testuale (uno, due, tre...)
        for (let w in textToNumMap) {
            if (text.includes(w) && textToNumMap[w] !== "all") {
                num = textToNumMap[w];
                break;
            }
        }
    }

    // Verifica validità numero
    if (num > 0 && num <= tempMemory.results.length) {
        const item = tempMemory.results[num - 1];
        displayEntry(item);
        speak("Ecco: " + item.output); // Feedback vocale più naturale
        lastMainOutput = item.output;
        setState(STATES.IDLE);   
    } else {
        speak("Numero non valido. Riprova o annulla.");
        // Rimaniamo in AWAITING_CHOICE per dare un'altra possibilità
    }
}

  function flashScreen(color, duration = 280) {
  const flash = document.getElementById('screenFlash');
  if (!flash) return;

  flash.style.backgroundColor = color;

  // reset animazione
  flash.classList.remove('flash');
  void flash.offsetWidth; // force reflow
  flash.classList.add('flash');

  // pulizia finale
  setTimeout(() => {
    flash.classList.remove('flash');
  }, duration);
}
