<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#007bff">
<title>Assistente vocale di Umberto F. M. Cefalà</title>
<link rel="manifest" href="manifest.json"> 
<style>
  /* ================= STILI (Mobile Friendly) ================= */
  html { font-size: 100%; box-sizing: border-box; }
  *, *:before, *:after { box-sizing: inherit; }
  
  body { 
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    text-align: center; 
    padding: 1rem; 
    margin: 0;
    background-color: #f8f9fa;
    color: #333;
  }
  
  /* Contenitore Bottoni */
  .controls-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 10px;
      flex-wrap: wrap;
  }

  /* Icona stato dinamica */
  #statusIconContainer {
      font-size: 2rem;
      margin-top: 10px;
      min-height: 40px;
  }

  /* Elenco Sezioni */
  #sectionsList {
      font-size: 0.85rem;
      color: #555;
      background-color: #e9ecef;
      padding: 8px;
      border-radius: 6px;
      margin-top: 10px;
      margin-bottom: 10px;
      border: 1px solid #ced4da;
      word-wrap: break-word;
  }

  /* Bottoni Principali */
  button {
      outline: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
  }

  #micButton {
      font-size: 3.5rem;
      width: 7rem;
      height: 7rem;
      border-radius: 50%;
      border: 6px solid #007bff;
      background-color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
  }
  
  /* Stati Microfono */
  #micButton.listening { 
      border-color: #dc3545; 
      background-color: #fff0f1; 
      transform: scale(1.05);
      animation: pulse 1.5s infinite;
  }
  
  @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.4); }
      70% { box-shadow: 0 0 0 15px rgba(220, 53, 69, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
  }

  #stopButton, #muteButton {
      font-size: 2rem;
      width: 4.5rem;
      height: 4.5rem;
      border-radius: 12px;
      border-width: 3px;
      border-style: solid;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      transition: transform 0.1s;
  }
  
  #stopButton:active, #muteButton:active { transform: scale(0.95); }
  #stopButton { border-color: #dc3545; color: #dc3545; }
  #muteButton { border-color: #6c757d; color: #6c757d; }
  
  #muteButton.mute-off { background-color: #e2e6ea; opacity: 0.7; }
  #muteButton.mute-on { background-color: #fff; opacity: 1; border-color: #28a745; color: #28a745; }

  /* Output Text Box */
  #output { 
    margin-top: 15px; 
    white-space: pre-wrap; 
    text-align: left; 
    background: #fff; 
    padding: 15px; 
    border-radius: 8px; 
    min-height: 150px; 
    max-height: 60vh;
    overflow-y: auto;
    border: 1px solid #ddd;
    font-size: 1rem;
    box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
  }
  
  /* Menu Opzioni */
  input, select, button.secondary-btn { margin: 5px; padding: 10px; font-size: 1rem; }
  
  #toggleButtons {
    cursor: pointer; margin-top: 15px; padding: 10px 20px; width: 100%; max-width: 300px;
    border: none; background-color: #6c757d; color: white; border-radius: 6px;
    font-weight: bold; font-size: 1rem;
  }

  #extraButtons {
    display: none; border: 1px solid #ccc; border-radius: 6px; padding: 10px;
    margin-top: 10px; width: 100%; max-width: 400px; margin-left: auto; margin-right: auto;
    background-color: #fff;
  }

  @media (max-width: 480px) {
      #micButton { width: 5.5rem; height: 5.5rem; font-size: 2.5rem; }
      #stopButton, #muteButton { width: 3.8rem; height: 3.8rem; font-size: 1.5rem; }
  }
</style>
</head>
<body>

<div class="controls-container"> 
<button id="micButton" aria-label="Avvia input vocale">🎙️</button>
<button id="stopButton" aria-label="Reset totale">⏹️</button>
<button id="muteButton" aria-label="Attiva/Disattiva audio">🔈</button>
</div>  
 <p>Assistente vocale di Umberto F. M. Cefalà</p>

<div id="sectionsList">Caricamento...</div>
<div id="statusIconContainer"></div> 
<div id="output"></div>

<button id="toggleButtons">⬇️ Opzioni Avanzate</button>
<div id="extraButtons">
  <button class="secondary-btn" id="infoArchive">Info Archivio</button> 
  <button class="secondary-btn" id="infoCommands">Lista Comandi</button> 
  <button class="secondary-btn" id="exportCommands">Esporta JSON</button>
  <input type="file" id="importFile" accept=".json">
  <button class="secondary-btn" id="resetArchive" style="color:red; border-color:red;">Reset Archivio</button>
</div>

<script>
/* ================== CONFIGURAZIONE & STATO ================== */
const defaultArchive = { "conversazione": [], "rubrica": [], "whatsapp": [] }; 
let archive = JSON.parse(localStorage.getItem('archive') || JSON.stringify(defaultArchive));

// Stati applicazione
let appState = "IDLE"; // IDLE, LISTENING, SPEAKING, AWAITING_SEARCH_CHOICE
let tempMemory = {}; 
let lastMainOutput = ""; 
let currentRecognition = null; 
let audioEnabled = true; 
let isSpeaking = false;
let synthesisQueue = []; // Coda per i chunk di testo (Android fix)

const SIGNATURE_TEXT = " // trascritto dall'assistente vocale";

// Vocabolario
const copyWords = ["copia", "salva", "trascrivi", "conserva", "memorizza"];
const affirmativeWords = ["sì", "va bene", "ok", "conferma", "esatto", "tutti", "tutto"];
const negativeWords = ["no", "cancella", "annulla", "ferma", "basta"];
const searchVerbs = ["cerca", "trova", "dimmi", "scegli"];
const searchPreps = ["in", "su", "nel", "nella", "nelle", "nei"];
const whatsappWords = ["invia", "manda", "spedisci", "scrivi"]; 
const readWords = ["leggi", "recita"];

const emojiMap = {
    "cuore": "❤️", "sorriso": "🙂", "risata": "😂", "ok": "👌", "pollice su": "👍",
    "pollice giù": "👎", "fuoco": "🔥", "stella": "⭐", "sole": "☀️", "luna": "🌙",
    "bacio": "💋", "abbraccio": "🤗", "festa": "🎉", "torta": "🎂",
    "regalo": "🎁", "musica": "🎵", "occhiolino": "😉", "triste": "😞", "arrabbiato": "😡",
    "pensoso": "🤔", "applauso": "👏", "preghiera": "🙏", "forza": "💪", "bomba": "💣",
    "pericolo": "⚠️", "spunta": "✅", "croce": "❌", "fantasma": "👻", "robot": "🤖", "alieno": "👽"
};

let textToNumMap = {};
function populateNumberMap() {
    const units = ["", "uno", "due", "tre", "quattro", "cinque", "sei", "sette", "otto", "nove"];
    const tens = ["", "dieci", "venti", "trenta", "quaranta", "cinquanta", "sessanta", "settanta", "ottanta", "novanta"];
    const specials = ["dieci", "undici", "dodici", "tredici", "quattordici", "quindici", "sedici", "diciassette", "diciotto", "diciannove"];

    for (let i = 1; i < 100; i++) {
        let word = "";
        if (i < 10) word = units[i]; 
        else if (i >= 10 && i < 20) word = specials[i - 10];
        else {
            let t = Math.floor(i / 10); let u = i % 10;
            let tenWord = tens[t]; let unitWord = units[u];
            if ((u === 1 || u === 8) && tenWord.length > 0) tenWord = tenWord.slice(0, -1);
            word = tenWord + unitWord;
        }
        textToNumMap[word] = i;
        if (word.endsWith("tre")) textToNumMap[word.replace("tre", "tré")] = i;
    }
    textToNumMap["un"] = 1; textToNumMap["primo"] = 1; textToNumMap["cento"] = 100;
}
populateNumberMap();

/* ================== GESTIONE AUDIO (TTS OTTIMIZZATO) ================== */

// Stop brutale di tutto l'audio
function stopAllAudio() {
    if (speechSynthesis.speaking || speechSynthesis.pending) {
        speechSynthesis.cancel();
    }
    synthesisQueue = [];
    isSpeaking = false;
}

// Funzione per dividere testo lungo in frasi (Fix Android 15s bug)
function splitTextIntoChunks(text) {
    // Divide per punteggiatura mantenendo i separatori, o max caratteri
    const regex = /[^.!?\n]+[.!?\n]+/g;
    let chunks = text.match(regex);
    if (!chunks || chunks.length === 0) chunks = [text];
    
    // Ulteriore controllo lunghezza (max 180 chars per sicurezza)
    let finalChunks = [];
    chunks.forEach(c => {
        if (c.length > 180) {
            let parts = c.match(/.{1,180}(\s|$)/g) || [c];
            finalChunks.push(...parts);
        } else {
            finalChunks.push(c);
        }
    });
    return finalChunks;
}

function speak(text, onEndCallback = null, isEntry = false) {
    stopAllAudio(); // Interrompe eventuale parlato precedente
    
    if (!audioEnabled) {
        if (!isEntry) appendOutput("🔇 Assistente impostato su muto 🔇");
        if (onEndCallback) onEndCallback();
        return;
    }

    // Preparazione coda di lettura
    synthesisQueue = splitTextIntoChunks(text);
    isSpeaking = true;

    let chunkIndex = 0;

    function playNextChunk() {
        if (chunkIndex >= synthesisQueue.length || !isSpeaking) {
            isSpeaking = false;
            if (onEndCallback) onEndCallback();
            return;
        }

        const utter = new SpeechSynthesisUtterance(synthesisQueue[chunkIndex]);
        utter.lang = 'it-IT';
        utter.rate = 1.0; 

        utter.onend = () => {
            chunkIndex++;
            playNextChunk();
        };

        utter.onerror = (e) => {
            console.error("TTS Error", e);
            chunkIndex++;
            playNextChunk();
        };

        speechSynthesis.speak(utter);
    }

    playNextChunk();
}

function speakEntry(item) { speak(item.output, null, true); }

/* ================== GESTIONE MICROFONO E LOGICA PULSANTI ================== */

const micBtn = document.getElementById('micButton');
const stopBtn = document.getElementById('stopButton');

// LOGICA CENTRALE DEL TASTO MICROFONO
micBtn.onclick = () => {
    // 1. BARGE-IN: Se sta parlando, zittisci e ascolta subito
    if (isSpeaking || speechSynthesis.speaking) {
        stopAllAudio();
        startListening(); 
        return;
    }

    // 2. INVIO RAPIDO: Se sta già ascoltando, ferma e processa
    if (appState === "LISTENING") {
        if (currentRecognition) currentRecognition.stop(); // Questo triggera onend -> processa
        return;
    }

    // 3. AVVIO STANDARD
    startListening();
};

stopBtn.onclick = () => {
    stopAndResetApp();
};

function stopAndResetApp() {
    stopAllAudio();
    if (currentRecognition) {
        currentRecognition.onend = null; // Evita callback residui
        currentRecognition.stop();
        currentRecognition = null;
    }
    appState = "IDLE";
    tempMemory = {};
    micBtn.classList.remove('listening');
    setStatusIcon("");
    document.getElementById('output').textContent = "";
    appendOutput("🗑️ Elimino gli input e termino l'ascolto");
}

function startListening() {
    // Se c'è un riconoscimento attivo, chiudilo pulito prima di riaprire
    if (currentRecognition) {
        try { currentRecognition.abort(); } catch(e){}
    }

    if (!('webkitSpeechRecognition' in window)) {
        appendOutput("⚠️ Browser non supportato. Utilizza Android con il browser Chrome.");
        return;
    }

    const r = new webkitSpeechRecognition();
    r.lang = "it-IT";
    r.interimResults = false; // Ottimizzazione CPU: elabora solo finale
    r.maxAlternatives = 1;

    r.onstart = () => {
        appState = "LISTENING";
        micBtn.classList.add('listening');
        appendOutput("⏳ Attendo istruzioni");
    };

    r.onresult = (event) => {
        const text = event.results[0][0].transcript.toLowerCase().trim();
        handleSpeechInput(text);
    };

    r.onerror = (event) => {
        if (event.error !== 'no-speech') appendOutput("⚠️ Microfono " + event.error);
    };

    r.onend = () => {
        micBtn.classList.remove('listening');
        currentRecognition = null;
        // Se stato è listening ma è finito senza input validi, torna idle o gestisci qui
        if(appState === "LISTENING") appState = "IDLE";
    };

    currentRecognition = r;
    r.start();
}

/* ================== INTELLIGENZA E COMANDI ================== */

function handleSpeechInput(text) {
    
    // GESTIONE SELEZIONE LISTA (Contestuale)
    if (appState === "AWAITING_SEARCH_CHOICE" || tempMemory.searchResults) {
        // Se l'utente dice un numero mentre c'è una lista attiva
        const num = parseNumber(text);
        if (num !== null || text.includes("tutti") || text.includes("tutto")) {
            handleSearchChoice(text);
            return;
        }
        // Se non è un numero, prosegue come comando normale (es. "Annulla" o nuovo comando)
    }

    // 1. COMANDI GLOBALI
    if (text === "stop" || text === "basta" || text === "fermati") { stopAndResetApp(); return; }
    
    // 2. WHATSAPP (Priorità alta, sezione ristretta)
    if (whatsappWords.some(w => text.startsWith(w))) {
        setStatusIcon('whatsapp');
        handleWhatsapp(text);
        return;
    }

    // 3. SALVA / COPIA
    const saveCmd = copyWords.find(w => text.startsWith(w));
    if (saveCmd) {
        setStatusIcon('transcription');
        handleSaveCommand(text, saveCmd);
        return;
    }

    // 4. RIPETI
    if (text === "ripeti") {
        if (lastMainOutput) speak("Ripeto: " + lastMainOutput);
        else speak("Nulla da ripetere");
        return;
    }

    // 5. LETTURA / RICERCA GENERICA
    if (readWords.some(w => text.startsWith(w))) {
        setStatusIcon('random');
        if (handleRead(text)) return;
    }

    // 6. METADATI (Autore/Titolo)
    if (text.includes("autore") || text.includes("titolo")) {
        setStatusIcon('search');
        let type = text.includes("autore") ? "meta_author" : "meta_title";
        let query = text.replace(/.*(autore|titolo)\s+/i, "").trim();
        if (query) { handleMetadataSearch(type, query); return; }
    }

    // 7. RICERCA AVANZATA ("Cerca in [sezione] [query]")
    const searchPattern = new RegExp(`(${searchVerbs.join('|')})\\s+(${searchPreps.join('|')})\\s+([a-zA-Z0-9_]+)\\s+(.*)`, 'i');
    const match = text.match(searchPattern);
    if (match) {
        setStatusIcon('search');
        const section = match[3].toLowerCase();
        const query = match[4].trim();
        if (archive[section]) { handleAdvancedSearch(section, query); return; } 
    }

    // 8. TRIGGER DIRETTO (Ricerca globale nei trigger)
    let found = findEntryByTrigger(text);
    if (found) {
        setStatusIcon('conversation');
        displayEntryDetails(found);
        speakEntry(found);
        lastMainOutput = found.output;
        // Pulisco eventuale memoria di ricerca precedente per non fare confusione
        tempMemory.searchResults = null;
        appState = "IDLE";
        return;
    }

    // FALLBACK (Ricerca Globale Automatica)
    // Invece di dare errore, proviamo a cercare il testo in tutte le sezioni
    handleGlobalSearchFallback(text);
  }

/* ================== IMPLEMENTAZIONE FUNZIONI ================== */

function findEntryByTrigger(text) {
    // Prima cerca in conversazione
    if (archive.conversazione) {
        let f = archive.conversazione.find(c => text.includes(c.trigger.toLowerCase()));
        if (f) return f;
    }
    // Poi cerca altrove
    for (let sec in archive) {
        if (sec === "conversazione") continue;
        let f = archive[sec].find(c => text.includes(c.trigger.toLowerCase()));
        if (f) return f;
    }
    return null;
}

function handleWhatsapp(text) {
    // Logica: "Invia a [Nome] [Messaggio]"
    // Cerca SOLO in archive['whatsapp']
    let cleanText = text.replace(/^(invia|manda|spedisci|scrivi)\s+(a|al|allo|alla)\s+/i, "").trim();
    
    // Tentativo di separare destinatario dal messaggio
    // Cerchiamo il match più lungo tra i trigger della sezione whatsapp
    const waList = archive['whatsapp'] || [];
    if (waList.length === 0) { speak("La sezione whatsapp è vuota"); return; }

    let bestMatch = null;
    let bestLen = 0;

    waList.forEach(item => {
        let trg = item.trigger.toLowerCase();
        // Controlla se il testo inizia con il trigger (es. "mamma")
        if (cleanText.startsWith(trg) && trg.length > bestLen) {
            bestLen = trg.length;
            bestMatch = item;
        }
    });

    if (bestMatch) {
        let messageBody = cleanText.substring(bestLen).trim();
        // Pulizia messaggio
        if (messageBody) messageBody = formatText(messageBody);
        
        let number = bestMatch.output.replace(/[^0-9+]/g, ""); // Pulisce numero
        
        if (!messageBody) { speak("Messaggio vuoto. Riprova"); return; }

        speak(`Apro WhatsApp per ${bestMatch.trigger}.`);
        appendOutput(`📤 WhatsApp: A ${bestMatch.trigger} (${number})\nMsg: "${messageBody}"`);
        
        setTimeout(() => {
            window.open(`https://wa.me/${number}?text=${encodeURIComponent(messageBody)}`, '_blank');
        }, 1500);
    } else {
        speak("Contatto non trovato nella sezione whatsapp");
    }
}

function handleSaveCommand(text, commandWord) {
    let content = text.substring(commandWord.length).trim();
    let useSignature = false;
    
    // Se l'utente dice solo "Salva", prende l'ultimo output
    if (!content && lastMainOutput) {
        content = lastMainOutput;
    } else if (!content) {
        speak("Cosa devo salvare?"); return;
    }

    if (content.includes("con firma")) {
        useSignature = true;
        content = content.replace("con firma", "").trim();
    }

    content = formatText(content);
    const finalString = useSignature ? content + SIGNATURE_TEXT : content;
    
    navigator.clipboard.writeText(finalString).then(() => {
        speak("Salvato negli appunti");
        appendOutput(`💾 Copiato: "${finalString}"`);
        lastMainOutput = content; // Aggiorna il contesto con ciò che si è salvato
    }).catch(e => speak("Errore nel salvataggio"));
}

function handleRead(text) {
    // 1. CASO RANDOM SINGOLO (rimane invariato)
    if (text.includes("casuale") || text.includes("random")) {
        const all = [].concat(...Object.values(archive));
        if (all.length === 0) { speak("Archivio vuoto"); return true; }
        
        const item = all[Math.floor(Math.random() * all.length)];
        displayEntryDetails(item);
        speakEntry(item);
        lastMainOutput = item.output;
        return true;
    }

    // 2. CASO LETTURA SEZIONE (A BLOCCHI DI 5)
    const sectionMatch = Object.keys(archive).find(sec => text.includes(sec));
    if (sectionMatch) {
        const list = archive[sectionMatch];
        if (!list || list.length === 0) {
            speak(`La sezione ${sectionMatch} è vuota`);
            return true;
        }

        // Inizializza la memoria per la paginazione
        tempMemory.readingList = list;
        tempMemory.readingIndex = 0; // Parte dall'inizio (o puoi mettere random)
        tempMemory.readingSection = sectionMatch;

        speak(`Inizio la lettura di ${sectionMatch}.`);
        readNextBatch(); // Avvia il primo blocco
        return true;
    }
    return false;
}

function readNextBatch() {
    const list = tempMemory.readingList;
    const idx = tempMemory.readingIndex;
    const BATCH_SIZE = 5;

    // Se abbiamo finito la lista
    if (idx >= list.length) {
        speak("Ho letto tutti gli elementi della sezione.");
        appState = "IDLE";
        tempMemory = {};
        return;
    }

    // Prendi i prossimi 5 elementi
    const chunk = list.slice(idx, idx + BATCH_SIZE);
    let speechText = "";
    let visualText = `--- LETTURA PARZIALE (${idx + 1} a ${Math.min(idx + BATCH_SIZE, list.length)}) ---\n`;

    chunk.forEach((item, i) => {
        speechText += `Elemento ${idx + i + 1}: ${item.trigger}. ${item.output}. \n`;
        visualText += `${idx + i + 1}. ${item.meta_title || item.trigger || "-"} \n Contenuto: ${item.output}. \n \n`;
    });

    // Aggiorna indice per la prossima volta
    tempMemory.readingIndex += BATCH_SIZE;
    
    // Aggiorna output visivo e salvabile
    appendOutput(visualText);
    lastMainOutput = visualText; // Cosi se dice "Salva" salva questo elenco

    // Parla e chiedi conferma se ce ne sono altri
    if (tempMemory.readingIndex < list.length) {
        speak(speechText + " Vuoi che continui con i prossimi 5?");
        appState = "AWAITING_MORE_CONTENT";
    } else {
        speak(speechText + " Lettura completata.");
        appState = "IDLE";
        tempMemory = {};
    }
}
  
function handleAdvancedSearch(section, query) {
    const list = archive[section];
    if (!list) { speak("Sezione inesistente"); return; }

    // Filtra (se query vuota, prende tutto)
    const results = list.filter(c => 
        (c.trigger && c.trigger.toLowerCase().includes(query)) || 
        (c.output && c.output.toLowerCase().includes(query))
    );

    if (results.length === 0) {
        speak(`Nessun risultato in ${section}`);
    } else if (results.length === 1) {
        displayEntryDetails(results[0]);
        speakEntry(results[0]);
        lastMainOutput = results[0].output;
    } else {
        // RISULTATI MULTIPLI
        tempMemory.searchResults = results;
        appState = "AWAITING_SEARCH_CHOICE"; // Imposta stato attesa
        
        let listStr = `Trovati ${results.length} risultati. `;
        results.forEach((r, i) => listStr += `Numero ${i + 1}: ${r.trigger}. `);
        
        // Formattazione visiva con "a capo"
        let visualList = `📋 Risultati trovati in "${section.toUpperCase()}":\n`;
        visualList += results.map((r,i) => `${i+1}. ${r.meta_title|| r.trigger || "-"}`).join("\n");
  
        appendOutput(visualList);
        lastMainOutput = visualList; // Permette di dire "Salva" per salvare la lista
      
        speak(listStr + " Scegli un numero o dì 'tutti'");
        // Nota: se l'utente preme Mic durante la lista, interrompe e può dire "due".
    }
}

function handleSearchChoice(text) {
    if (negativeWords.some(w => text.includes(w))) {
        speak("Annullato");
        tempMemory.searchResults = null;
        appState = "IDLE";
        return;
    }

    const results = tempMemory.searchResults;
    if (!results) { appState = "IDLE"; return; }

    // Opzione "Tutti"
    if (text.includes("tutti") || text.includes("tutto")) {
        speak("Leggo tutti i risultati.");
        let combinedOutput = results.map(r => r.output).join(". \nNuovo elemento: ");
        lastMainOutput = combinedOutput;
        speak(combinedOutput);
        appState = "IDLE";
        return;
    }

    const choiceNum = parseNumber(text);
    if (choiceNum !== null && choiceNum > 0 && choiceNum <= results.length) {
        const item = results[choiceNum - 1];
        displayEntryDetails(item);
        speakEntry(item);
        lastMainOutput = item.output;
        // Non puliamo tempMemory subito se volesse sceglierne un altro, 
        // ma resettiamo appState per permettere comandi normali come "salva"
        appState = "IDLE"; 
    } else {
        speak("Numero non valido. Riprova");
    }
}

function handleMetadataSearch(type, query) {
    const all = [].concat(...Object.values(archive));
    const results = all.filter(c => c[type] && c[type].toLowerCase().includes(query));
    
    if (results.length > 0) {
        tempMemory.searchResults = results;
        appState = "AWAITING_SEARCH_CHOICE";
        let out = `Trovati ${results.length} per ${query}. `;
        results.forEach((r, i) => out += `${i+1}: ${r.meta_title || r.trigger}. `);
      
        // Formattazione visiva con "a capo"
        let visualList2 = `📋 Risultati per "${query.toUpperCase()}":\n`;
        visualList2 += results.map((r,i) => `${i+1}. ${r.meta_title|| r.trigger || "-"}`).join("\n");
  
        appendOutput(visualList2);
        lastMainOutput = visualList2; // Permette di dire "Salva" per salvare la lista
      
        speak(out + " Quale leggo?");
    } else {
        speak("Nessun riscontro");
    }
}

function handleGlobalSearchFallback(query) {
    let allResults = [];
    let resultsBySection = {};
    const q = query.toLowerCase().trim();

    // 1. Scansiona TUTTE le sezioni dell'archivio
    for (let section in archive) {
        // Filtra gli elementi che contengono la query in trigger, output, titolo o autore
        let matches = archive[section].filter(item => {
            const t = (item.trigger || "").toLowerCase();
            const o = (item.output || "").toLowerCase();
            const mt = (item.meta_title || "").toLowerCase();
            const ma = (item.meta_author || "").toLowerCase();
            return t.includes(q) || o.includes(q) || mt.includes(q) || ma.includes(q);
        });

        // Se ci sono match in questa sezione, salvali
        if (matches.length > 0) {
            resultsBySection[section] = matches;
            // Aggiungiamo alla lista piatta per permettere la selezione numerica (1, 2, 3...)
            allResults = allResults.concat(matches);
        }
    }

    // 2. NESSUN RISULTATO TROVATO
    if (allResults.length === 0) {
         speak("Non ho capito e non ho trovato nulla");
         return;
    }

    // 3. RISULTATI TROVATI: Costruiamo la risposta raggruppata
    tempMemory.searchResults = allResults; // Salviamo la lista per la scelta (es. "Numero 5")
    appState = "AWAITING_SEARCH_CHOICE";   // Attiviamo la modalità scelta

    let verbalOutput = `Ho trovato ${allResults.length} risultati`;
    let visualOutput = "";
    
    // Contatore globale unico (così l'utente dice "5" e non "3 della seconda sezione")
    let globalCounter = 1;

    for (let sec in resultsBySection) {
        // Aggiunge intestazione sezione al parlato e al testo
        verbalOutput += `Nella sezione ${sec}: `;
        visualOutput += `\n--- SEZIONE: ${sec.toUpperCase()} ---\n`;

        resultsBySection[sec].forEach(item => {
            // Cosa dire a voce: "Numero X: titolo o trigger"
            verbalOutput += `Numero ${globalCounter}: ${item.meta_title || item.trigger || "elemento senza nome"}. `;
            
            // Cosa scrivere a video
            visualOutput += `${globalCounter}. ${item.meta_title ? "Titolo: " + item.meta_title : item.trigger ? "Ricerca: " + item.trigger : "-"}\n`;
            
            globalCounter++;
        });
    }

    appendOutput(visualOutput);
    speak(verbalOutput + " Quale numero leggo?");
  }
  
/* ================== UTILITIES ================== */
function formatText(str) {
    let s = str;
    s = s.replace(/emoji\s+(\w+(\s\w+)?)/gi, (match, p1) => {
        let key = p1.toLowerCase().trim();
        return emojiMap[key] ? emojiMap[key] : match;
    });
    // Capitalizzazione base
    s = s.replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase());
    // Punteggiatura vocale
    s = s.replace(/\bvirgola\b/gi, ",").replace(/\bpunto\b/gi, ".")
         .replace(/\bdue punti\b/gi, ":").replace(/\bpunto interrogativo\b/gi, "?")
         .replace(/\bpunto esclamativo\b/gi, "!").replace(/\ba capo\b/gi, "\n");
    s = s.replace(/\s*\n\s*/g, "\n"); // toglie spazio prima e dopo a capo
    s = s.replace(/\s*,/g, ","); // toglie eventuali spazi prima della virgola 
    s = s.replace(/\s*\./g, "."); // toglie spazi prima del punto

    return s;
}

function parseNumber(text) {
    if (!text) return null;
    let t = text.toLowerCase().replace(/[^\w ]/g, "");
    
    // Cerca cifre dirette
    const digitMatch = t.match(/\d+/);
    if (digitMatch) return parseInt(digitMatch[0]);

    // Cerca parole
    for (const [word, value] of Object.entries(textToNumMap)) {
        const regex = new RegExp(`\\b${word}\\b`, 'i');
        if (regex.test(t)) return value;
    }
    return null;
}

function displayEntryDetails(item) {
    const out = `----------------
Titolo: ${item.meta_title || "-"}
Autore: ${item.meta_author || "-"}
Contenuto: ${item.output || "N/A"}
Ricerca: ${item.trigger || "N/A"}
Tag: ${item.tag || "-"}
----------------`;
    appendOutput(out);
}

function updateSectionList() {
    const listDiv = document.getElementById('sectionsList');
    const sections = Object.keys(archive);
    const labels = sections.map(sec => `${sec} (${archive[sec].length})`);
    listDiv.textContent = "Sezioni: " + labels.join(" | ");
}
updateSectionList();

function appendOutput(text) {
    const out = document.getElementById('output');
    out.textContent += text + "\n";
    out.scrollTop = out.scrollHeight;
}

function setStatusIcon(type) {
    const c = document.getElementById('statusIconContainer');
    let icon = "";
    switch(type) {
        case 'search': icon = "🔍 Ricerca"; break;
        case 'conversation': icon = "💬 Chat"; break;
        case 'random': icon = "📖 Lettura random"; break;
        case 'transcription': icon = "🪶 Trascrizione"; break;
        case 'whatsapp': icon = "📱 WhatsApp"; break;
    }
    c.textContent = icon;
}

    ex.style.display = ex.style.display === 'block' ? 'none' : 'block';
};

document.getElementById('infoCommands').onclick = () => appendOutput("Comandi: Salva, Copia con firma, Invia whatsapp a..., Cerca in [sezione], Leggi [sezione], Ripeti, Stop.");
document.getElementById('exportCommands').onclick = () => {
    const a = document.createElement('a');
    a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(archive, null, 2));
    a.download = "archivio_assistente.json"; a.click();
};
document.getElementById('importFile').onchange = (e) => {
    const r = new FileReader();
    r.onload = ev => {
        try {
            const j = JSON.parse(ev.target.result);
            // Merge intelligente
            for (let k in j) {
                if (!archive[k]) archive[k] = [];
                j[k].forEach(i => archive[k].push(i));
            }
            localStorage.setItem('archive', JSON.stringify(archive));
            updateSectionList();
            appendOutput("Import completato.");
        } catch(e) { appendOutput("Errore file JSON."); }
    };
    if (e.target.files[0]) r.readAsText(e.target.files[0]);
};
document.getElementById('resetArchive').onclick = () => {
    if(confirm("Sei sicuro di voler cancellare tutto l'archivio?")) {
        archive = JSON.parse(JSON.stringify(defaultArchive));
        localStorage.setItem('archive', JSON.stringify(archive));
        updateSectionList();
        appendOutput("Archivio resettato.");
    }
};
