<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#007bff">
<title>Assistente vocale di Umberto F. M. Cefalà</title>
<link rel="manifest" href="manifest.json"> 
<style>
  /* ================= STILI (Mobile Friendly REM) ================= */
  html { font-size: 100%; box-sizing: border-box; }
  *, *:before, *:after { box-sizing: inherit; }
  
  body { 
    font-family: Arial, sans-serif; 
    text-align: center; 
    padding: 1.25rem; 
    margin: 0;
    background-color: #fff;
  }
  
  /* Contenitore Bottoni */
  .controls-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.625rem;
      flex-wrap: wrap;
  }

  /* Icona stato dinamica */
  #statusIconContainer {
      font-size: 2rem;
      margin-top: 0.5rem;
      min-height: 2.5rem;
  }

  /* Elenco Sezioni */
  #sectionsList {
      font-size: 0.9rem;
      color: #333;
      background-color: #e9ecef;
      padding: 0.5rem;
      border-radius: 0.3125rem;
      margin-top: 0.625rem;
      margin-bottom: 0.5rem;
      line-height: 1.4;
      border: 1px solid #ced4da;
  }

  /* Stile Bottoni Principali */
  #micButton {
      font-size: 3.75rem;
      width: 7.5rem;
      height: 7.5rem;
      border-radius: 50%;
      border: 0.3125rem solid #007bff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0.625rem;
      transition: background-color 0.2s, border-color 0.2s;
  }
  #micButton:hover { background-color: #e2e6ea; }
  #micButton.listening { border-color: #dc3545; background-color: #fdf5f6; }

  #stopButton, #muteButton {
      font-size: 2.25rem;
      width: 5rem;
      height: 5rem;
      border-radius: 1rem;
      border-width: 0.1875rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0.625rem;
  }
  
  #stopButton:hover { background-color: #fdf5f6; }

  /* Output Text Box */
  #output { 
    margin-top: 0.5rem; 
    white-space: pre-wrap; 
    text-align: left; 
    background: #f4f4f4; 
    padding: 0.625rem; 
    border-radius: 0.3125rem; 
    min-height: 9.375rem; 
    border: 1px solid #ccc;
    font-size: 1rem;
  }
  
  input, select, button { margin: 0.3125rem; padding: 0.3125rem; font-size: 1rem; }
  
  #toggleButtons {
    cursor: pointer; margin-top: 0.625rem; padding: 0.625rem; width: 12.5rem;
    border: 2px solid #6c757d; background-color: #f8f9fa; border-radius: 0.3125rem;
    font-weight: bold; font-size: 1.125rem;
  }

  #extraButtons {
    display: none; border: 1px solid #ccc; border-radius: 0.3125rem; padding: 0.625rem;
    margin-top: 0.3125rem; max-width: 25rem; margin-left: auto; margin-right: auto;
    background-color: #fff;
  }

  /* Stati bottone Mute */
  #muteButton.mute-off {
      background-color: #e9ecef;
      border-color: #6c757d;
      color: #6c757d;
  }
  #muteButton.mute-on {
      background-color: #fff;
      border-color: #6c757d;
      color: #6c757d;
  }

  button:active {
      transform: scale(0.95);
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
  }

  #micButton { box-shadow: 0 4px 6px rgba(0, 123, 255, 0.3); }
  #stopButton { border: 0.1875rem solid #dc3545; background: #fff; color: #dc3545; }
  #muteButton { border: 0.1875rem solid #6c757d; }

  @media (max-width: 480px) {
      #micButton { width: 5.5rem; height: 5.5rem; font-size: 2.8rem; }
      #stopButton, #muteButton { width: 4rem; height: 4rem; font-size: 1.8rem; }
  }
</style>
</head>
<body>

<div class="controls-container"> 
<button id="micButton" aria-label="Avvia registrazione vocale">🎙️</button>
<button id="stopButton" aria-label="Ferma tutto">⏹️</button>
<button id="muteButton" aria-label="Attiva/Disattiva audio">🔈</button>
</div>

<div id="sectionsList">Caricamento sezioni...</div>

<div id="statusIconContainer"></div>
<div id="output"></div>

<button id="toggleButtons">⬇️ Opzioni</button>
<div id="extraButtons">
  <button id="infoArchive">Informazioni Archivio</button> 
  <button id="infoCommands">Informazioni Comandi</button> 
  <button id="exportCommands">Esporta Archivio</button>
  <input type="file" id="importFile" accept=".json">
  <button id="resetArchive">Reset Archivio</button>
</div>

<script>
/* ================== CONFIG E STATO ================== */
const defaultArchive = { "conversazione": [], "rubrica": [] }; 
let archive = JSON.parse(localStorage.getItem('archive') || JSON.stringify(defaultArchive));

let appState = "IDLE"; 
let tempMemory = {}; 
let lastMainOutput = ""; 
let currentRecognition = null; 
const SIGNATURE_TEXT = " - - testo trascritto dall'assistente vocale.";
let lastInterimResult = "";
let audioEnabled = true; 
  
// Vocabolario
const copyWords = ["copia", "salva", "trascrivi", "conserva", "riporta", "tieni"];
const affirmativeWords = ["sì", "va bene", "ok", "conferma", "esatto", "tutti", "tutto"];
const negativeWords = ["no", "cancella", "rimuovi", "annulla", "nessuno", "basta"];
const searchVerbs = ["cerca", "cerchi", "trova", "trovi", "dimmi", "dici"];
const searchPreps = ["in", "nelle", "nei", "nello", "nella", "su", "sulle", "sui", "sullo", "sulla"];
const readWords = ["leggi", "recita", "esponi"];
const randomWords = ["random", "a caso", "casuale"];
const whatsappWords = ["invia", "manda", "spedisci"]; 

// Mappa Emoji
const emojiMap = {
    "cuore": "❤️", "sorriso": "🙂", "risata": "😂", "ok": "👌", "pollice su": "👍",
    "pollice giù": "👎", "fuoco": "🔥", "stella": "⭐", "sole": "☀️", "luna": "🌙",
    "bacio": "😘", "abbraccio": "🤗", "festa": "🎉", "tort": "🎂", "torta": "🎂",
    "regalo": "🎁", "musica": "🎵", "occhiolino": "😉", "triste": "😢", "arrabbiato": "😡",
    "pensoso": "🤔", "applauso": "👏", "preghiera": "🙏", "forza": "💪", "bomba": "💣",
    "attenzione": "⚠️", "spunta": "✅", "croce": "❌", "fantasma": "👻", "robot": "🤖", "alieno": "👽"
};

/* ================== MAPPA NUMERI ================== */
let textToNumMap = {
    "un": 1, "uno": 1, "primo": 1,
    "due": 2, "secondo": 2,
    "tre": 3, "terzo": 3,
    "quattro": 4, "quarto": 4,
    "cinque": 5, "quinto": 5,
    "sei": 6, "sesto": 6,
    "sette": 7, "settimo": 7,
    "otto": 8, "ottavo": 8,
    "nove": 9, "nono": 9,
    "dieci": 10, "decimo": 10,
    "cento": 100
};

/* ================== FUNZIONI DI CONTROLLO RISORSE ================== */

// Funzione base per stoppare audio e TTS (SENZA resettare la logica dell'app)
function stopHardwareOnly() {
    try { speechSynthesis.cancel(); } catch(e) {}
    if (currentRecognition) {
        try {
            currentRecognition.onend = null; // Rimuove callback per evitare loop
            currentRecognition.stop();
        } catch(e) {}
        currentRecognition = null;
    }
}

// Funzione per reset totale (Bottone Stop / Timeout)
function stopAndResetApp() {
    stopHardwareOnly();
    appState = "IDLE";
    tempMemory = {};
    document.getElementById('micButton').classList.remove('listening');
    if (inactivityTimer) clearTimeout(inactivityTimer);
    inactivityTimer = null;
}

let inactivityTimer = null;
const INACTIVITY_TIMEOUT = 15000; 

function handleInactivityTimeout() {
    stopAndResetApp();
    lastMainOutput = "";
    appendOutput("Bot: Timeout inattività.");
}

function resetInactivityTimer() {
    if (inactivityTimer) clearTimeout(inactivityTimer);
    inactivityTimer = setTimeout(handleInactivityTimeout, INACTIVITY_TIMEOUT);
}
  
function populateNumberMap() {
    const units = ["", "uno", "due", "tre", "quattro", "cinque", "sei", "sette", "otto", "nove"];
    const tens = ["", "dieci", "venti", "trenta", "quaranta", "cinquanta", "sessanta", "settanta", "ottanta", "novanta"];
    const specials = ["dieci", "undici", "dodici", "tredici", "quattordici", "quindici", "sedici", "diciassette", "diciotto", "diciannove"];

    for (let i = 1; i < 100; i++) {
        let word = "";
        if (i < 10) continue; 
        else if (i >= 10 && i < 20) word = specials[i - 10];
        else {
            let t = Math.floor(i / 10);
            let u = i % 10;
            let tenWord = tens[t];
            let unitWord = units[u];
            if ((u === 1 || u === 8) && tenWord.length > 0) tenWord = tenWord.substring(0, tenWord.length - 1);
            word = tenWord + unitWord;
        }
        textToNumMap[word] = i;
        if (word.endsWith("tre")) textToNumMap[word.replace("tre", "tré")] = i;
    }
}
populateNumberMap();

/* ================== UI HELPER ================== */
function updateSectionList() {
    const listDiv = document.getElementById('sectionsList');
    const sections = Object.keys(archive);
    if (sections.length === 0) { listDiv.textContent = "Elenco delle sezioni: Nessuna sezione presente"; return; }
    const labels = sections.map(sec => `${sec} (n. ${Array.isArray(archive[sec]) ? archive[sec].length : 0})`);
    listDiv.textContent = "Elenco delle sezioni: " + labels.join(" - ");
}
updateSectionList();

function setStatusIcon(type) {
    const container = document.getElementById('statusIconContainer');
    let icon = "", label = "";
    switch(type) {
        case 'search': icon = "🔍"; label = "Ricerca"; break;
        case 'conversation': icon = "💬"; label = "Conversazione"; break;
        case 'random': icon = "📖"; label = "Lettura Random"; break;
        case 'transcription': icon = "🪶"; label = "Trascrizione"; break;
        case 'whatsapp': icon = "📱"; label = "WhatsApp"; break;
    }
    container.innerHTML = icon ? `${icon} <span style="font-size:1rem; vertical-align:middle">${label}</span>` : "";
}

function appendOutput(text) {
  const outDiv = document.getElementById('output');
  outDiv.textContent += text + "\n";
  outDiv.scrollTop = outDiv.scrollHeight;
}

function displayEntryDetails(item) {
    const out = `----------------
ricerca: ${item.trigger || "N/A"}
contenuto: ${item.output || "N/A"}
tag: ${item.tag || "-"}
titolo: ${item.meta_title || "-"}
autore: ${item.meta_author || "-"}
----------------`;
    appendOutput(out);
}

/* ================== AUDIO ================== */
function speak(text, onEndCallback = null, isEntry = false) {
  if (!audioEnabled) { 
      if (!isEntry) appendOutput("Bot (muto): " + text);
      if (onEndCallback) onEndCallback();
      return;
  }
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'it-IT';
  if (!isEntry) appendOutput("Bot: " + text);
  if (onEndCallback) utter.onend = onEndCallback;
  speechSynthesis.speak(utter);
}

function speakEntry(item) { speak(item.output, null, true); }

/* ================== CONTROLLI VOCALI ================== */
function activateListening() {
    // Stop solo hardware, NON resetta appState (così non perdiamo la memoria della scelta)
    stopHardwareOnly(); 
    startListening(handleSpeech);
    appState = (appState === "AWAITING_SEARCH_CHOICE") ? "AWAITING_SEARCH_CHOICE" : "LISTENING";
}

document.getElementById('micButton').onclick = () => {
    const micBtn = document.getElementById('micButton');
    // Toggle manuale
    if (micBtn.classList.contains('listening')) {
        stopAndResetApp(); // Se premo mentre ascolto, resetto tutto
        appendOutput("Ascolto interrotto.");
        return;
    }
    activateListening();
};

document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'v') {
        e.preventDefault(); 
        document.getElementById('micButton').click();
    }
});

document.getElementById('stopButton').onclick = () => {
    stopAndResetApp();
    document.getElementById('output').textContent = "";
    setStatusIcon("");
};

function startListening(callback) {
    if (!('webkitSpeechRecognition' in window)) {
        appendOutput("ERRORE: Browser non supportato.");
        return;
    }

    const mic = document.getElementById('micButton');
    mic.classList.add('listening');

    const r = new webkitSpeechRecognition();
    currentRecognition = r;
    r.lang = "it-IT";
    r.interimResults = true;
    r.maxAlternatives = 1;
    lastInterimResult = "";

    r.onresult = (event) => {
        const text = event.results[0][0].transcript.toLowerCase();
        lastInterimResult = text;
        if (event.results[0].isFinal) {
            lastInterimResult = "";
            callback(text);
        }
    };

    r.onerror = event => {
        if (event.error !== 'no-speech') appendOutput("Errore Mic: " + event.error);
    };

    r.onend = () => {
        mic.classList.remove('listening');
        currentRecognition = null;
        // Non resettiamo nulla qui. La logica è gestita dal callback o dal timeout.
    };

    r.start();
    resetInactivityTimer();
    appendOutput("...In ascolto...");
}

/* ================== LOGICA COMANDI ================== */
function handleSpeech(text) {
  appendOutput("Tu: " + text);
  resetInactivityTimer();
  
  // *** FIX IMPORTANTE: GESTIONE SCELTA ***
  if (appState === "AWAITING_SEARCH_CHOICE") {
      handleSearchChoice(text);
      return;
  }

  // 1. Ripeti
  if (text === "ripeti") {
      speak(lastMainOutput ? "Ripeto: " + lastMainOutput : "Nulla da ripetere.");
      return;
  }

  // 2. WhatsApp
  if (whatsappWords.some(w => text.startsWith(w))) {
      setStatusIcon('whatsapp');
      handleWhatsapp(text);
      return;
  }

  // 3. Copia/Salva
  const commandWord = copyWords.find(w => text.startsWith(w));
  if (commandWord) {
      setStatusIcon('transcription');
      handleCopyCommand(text, commandWord);
      return;
  }

  // 4. Lettura
  if (readWords.some(w => text.startsWith(w))) {
      setStatusIcon('random');
      if (handleRead(text)) return;
  }

  // 5. Metadati (autore/titolo)
  if (text.includes("autore") || text.includes("titolo")) {
      setStatusIcon('search');
      let type = text.includes("autore") ? "meta_author" : "meta_title";
      let splitter = text.includes("autore") ? "autore" : "titolo";
      let query = text.split(splitter)[1].trim();
      if (query) { handleMetadataSearch(type, query); return; }
  }

  // 6. Ricerca Avanzata (Cerca in...)
  const searchPattern = new RegExp(`(${searchVerbs.join('|')})\\s+(${searchPreps.join('|')})\\s+([a-zA-Z0-9_]+)\\s+(.*)`, 'i');
  const match = text.match(searchPattern);
  if (match) {
      setStatusIcon('search');
      const section = match[3].toLowerCase();
      const query = match[4].trim();
      if (archive[section]) { handleAdvancedSearch(section, query); return; } 
      else { speak(`Sezione "${section}" inesistente.`); return; }
  }

  // 7. Ricerca Diretta (Trigger)
  let found = null;
  if (archive.conversazione) found = archive.conversazione.find(c => text.includes(c.trigger.toLowerCase()));
  if (!found) {
      for (let sec in archive) {
          if (sec === "conversazione") continue;
          found = archive[sec].find(c => text.includes(c.trigger.toLowerCase()));
          if (found) break;
      }
  }

  if (found) {
      setStatusIcon('conversation');
      displayEntryDetails(found);
      speakEntry(found);
      lastMainOutput = found.output; 
      return;
  }

  // Non riconosciuto
  lastMainOutput = text;
  setStatusIcon('');
  appendOutput("(Testo non riconosciuto. Dì 'Salva', 'Ripeti' o 'Invia a...')");
}

/* ================== IMPLEMENTAZIONE FUNZIONI ================== */
function formatText(str) {
    let s = str;
    s = s.replace(/emoji\s+(\w+(\s\w+)?)/gi, (match, p1) => {
        let key = p1.toLowerCase().trim();
        return emojiMap[key] ? emojiMap[key] : match;
    });
    s = s.replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase());
    return s;
}

function parseNumber(text) {
    if (!text) return null;
    let t = text.toLowerCase().trim().replace(/[^\wàèéìòù0-9 ]+/g, ""); // pulizia
    
    const digitMatch = t.match(/\d+/);
    if (digitMatch) return parseInt(digitMatch[0]);

    const afterNumero = t.match(/numero\s+(\d+)/);
    if (afterNumero) return parseInt(afterNumero[1]);

    // Match preciso per evitare falsi positivi (es. "nessuno" vs "uno")
    for (const [word, value] of Object.entries(textToNumMap)) {
        // Regex word boundary: \bparola\b
        const regex = new RegExp(`\\b${word}\\b`, 'i');
        if (regex.test(t)) return value;
    }
    return null;
}

function handleWhatsapp(text) {
    let cleanText = text.replace(/^(invia|manda|spedisci)\s+(a|al|allo|alla)\s+/i, "").trim();
    if (!cleanText) { speak("A chi devo inviare?"); return; }

    let bestMatch = null, bestLen = 0;
    for (let sec in archive) {
        archive[sec].forEach(item => {
            let trg = item.trigger.toLowerCase();
            if (cleanText.startsWith(trg) && trg.length > bestLen) {
                bestLen = trg.length; bestMatch = item;
            }
        });
    }

    if (bestMatch) {
        let messageBody = cleanText.substring(bestLen).trim();
        if (messageBody) messageBody = formatText(messageBody);
        let number = bestMatch.output.replace(/[^0-9+]/g, "");
        
        if (!messageBody) { speak("Messaggio vuoto."); return; }

        speak(`Apro WhatsApp per ${bestMatch.trigger}.`);
        appendOutput(`Bot: Apro WA per ${bestMatch.trigger} -> "${messageBody}"`);
        setTimeout(() => window.open(`https://wa.me/${number}?text=${encodeURIComponent(messageBody)}`, '_blank'), 1500);
    } else {
        speak("Contatto non trovato.");
    }
}

function handleCopyCommand(text, commandWord) {
    let content = text.substring(commandWord.length).trim();
    let useSignature = false;
    if (content.includes("con firma") || content.includes("aggiungi firma")) {
        useSignature = true;
        content = content.replace(/con firma|aggiungi firma/gi, "").trim();
    }
    
    if (!content && lastMainOutput) content = lastMainOutput;
    else if (!content) { speak("Nulla da salvare."); return; }

    content = content.replace(/\bvirgola\b/gi, ",").replace(/\bpunto\b/gi, ".").replace(/\bdue punti\b/gi, ":")
                     .replace(/\bpunto e virgola\b/gi, ";").replace(/\bpunto esclamativo\b/gi, "!").replace(/\bpunto interrogativo\b/gi, "?")
                     .replace(/\ba capo\b/gi, "\n");
    content = formatText(content);
    content = content.replace(/\s+([,.:;!?])/g, '$1').replace(/([,.:;!?])\s*/g, '$1 ').replace(/\s\s+/g, ' ').trim();

    const finalString = useSignature ? content + SIGNATURE_TEXT : content;
    navigator.clipboard.writeText(finalString).then(() => {
        speak(useSignature ? "Salvato con firma." : "Salvato.");
        appendOutput(`📋 Appunti: "${finalString}"`);
        lastMainOutput = content;
    });
}

function handleRead(text) {
    if (text.includes("casuale")) {
        const allEntries = [].concat(...Object.values(archive));
        if(allEntries.length === 0) { speak("Archivio vuoto."); return true; }
        const item = allEntries[Math.floor(Math.random() * allEntries.length)];
        displayEntryDetails(item); speakEntry(item); return true;
    }
    const sectionMatch = Object.keys(archive).find(sec => text.includes(sec));
    if (sectionMatch) {
        const list = archive[sectionMatch];
        if (!list || list.length === 0) { speak(`Sezione ${sectionMatch} vuota.`); return true; }
        speak(`Leggo ${sectionMatch}.`);
        let index = 0;
        function speakNext() {
            if (index >= list.length || appState !== "LISTENING") return;
            const item = list[index];
            displayEntryDetails(item);
            speak(item.output, () => { index++; speakNext(); });
        }
        setTimeout(speakNext, 1000);
        return true;
    }
    return false;
}

function handleAdvancedSearch(section, query) {
    const list = archive[section];
    const results = list.filter(c => (c.trigger && c.trigger.toLowerCase().includes(query)) || (c.output && c.output.toLowerCase().includes(query)));
    processSearchResults(results, `in ${section} per "${query}"`);
}

function handleMetadataSearch(type, query) {
    const all = [].concat(...Object.values(archive));
    const results = all.filter(c => c[type] && c[type].toLowerCase().includes(query));
    processSearchResults(results, `per ${type === "meta_author" ? "autore" : "titolo"} "${query}"`);
}

function processSearchResults(results, context) {
    if (results.length === 0) {
        speak("Nessun risultato " + context);
    } else if (results.length === 1) {
        displayEntryDetails(results[0]);
        speakEntry(results[0]);
        lastMainOutput = results[0].output;
    } else {
        let listStr = `Trovati ${results.length} risultati. `;
        results.forEach((r, i) => listStr += `${i + 1}: ${r.meta_title || r.trigger || "Elemento"}. `);
        
        appendOutput("Risultati multipli:\n" + listStr);
        tempMemory.searchResults = results;
        
        // Impostiamo lo stato PRIMA di parlare
        appState = "AWAITING_SEARCH_CHOICE"; 

        speak(listStr + " Scegli il numero.", () => {
            // Callback fine TTS:
            // Controlliamo se siamo ancora in attesa (l'utente potrebbe aver premuto stop nel frattempo)
            if (appState === "AWAITING_SEARCH_CHOICE") {
                appendOutput("...Attendo scelta numero...");
                // Avviamo ascolto senza resettare lo stato
                stopHardwareOnly(); 
                startListening(handleSpeech);
            }
        });
    }
}

function handleSearchChoice(text) {
    if (negativeWords.some(w => text.includes(w))) {
        speak("Annullato.");
        stopAndResetApp();
        return;
    }

    const results = tempMemory.searchResults;
    if (!results) { stopAndResetApp(); return; }

    if (text.includes("tutti") || text.includes("tutto")) {
        speak(`Leggo tutto.`);
        appState = "IDLE"; // Reset stato per evitare loop, ma continua lettura
        let idx = 0;
        function playNext() {
            if (idx >= results.length) return;
            displayEntryDetails(results[idx]);
            speak(`Numero ${idx+1}. ` + results[idx].output, () => { idx++; playNext(); });
        }
        playNext();
        return;
    }
    
    const choiceNum = parseNumber(text);
    if (choiceNum !== null && choiceNum > 0 && choiceNum <= results.length) {
        const item = results[choiceNum - 1];
        displayEntryDetails(item);
        speakEntry(item);
        lastMainOutput = item.output;
        appState = "IDLE"; // Scelta fatta, torno a IDLE
    } else {
        // Se non capisco, richiedo. IMPORTANTE: non resettare appState qui
        speak("Numero non valido, ripeti.", () => {
             if (appState === "AWAITING_SEARCH_CHOICE") {
                 stopHardwareOnly();
                 startListening(handleSpeech);
             }
        });
    }
}

/* ================== EXTRA UI ================== */
document.getElementById('toggleButtons').onclick = () => {
    const extra = document.getElementById('extraButtons');
    extra.style.display = (extra.style.display === 'block') ? 'none' : 'block';
};
document.getElementById('infoArchive').onclick = () => document.getElementById('output').textContent = JSON.stringify(archive, null, 2);
document.getElementById('infoCommands').onclick = () => document.getElementById('output').textContent = "Comandi: Salva..., Cerca..., Invia a..., Leggi...";
document.getElementById('exportCommands').onclick = () => {
  const a = document.createElement('a');
  a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(archive, null, 2));
  a.download = "archivio.json"; a.click();
};
document.getElementById('importFile').onchange = (e) => {
  const r = new FileReader();
  r.onload = ev => { 
      try { 
          const j = JSON.parse(ev.target.result); 
          for(let k in j) { if(!archive[k]) archive[k]=[]; j[k].forEach(i=>archive[k].push(i)); }
          localStorage.setItem('archive', JSON.stringify(archive)); updateSectionList(); appendOutput("Importato.");
      } catch(e) { appendOutput("Errore JSON"); }
  };
  if(e.target.files[0]) r.readAsText(e.target.files[0]);
};
document.getElementById('resetArchive').onclick = () => {
    if(confirm("Reset?")) { archive=JSON.parse(JSON.stringify(defaultArchive)); localStorage.setItem('archive', JSON.stringify(archive)); updateSectionList(); }
};

window.addEventListener('beforeunload', () => stopAndResetApp());
document.addEventListener('visibilitychange', () => { if(document.hidden) stopAndResetApp(); });

const muteButton = document.getElementById('muteButton');
function updateMuteButtonUI() {
    muteButton.textContent = audioEnabled ? "🔈" : "🔇";
    muteButton.className = audioEnabled ? "mute-on" : "mute-off";
}
muteButton.onclick = () => { audioEnabled = !audioEnabled; updateMuteButtonUI(); };
updateMuteButtonUI();
</script>
