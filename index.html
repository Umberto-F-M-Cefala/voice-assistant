function populateNumberMap() {
    const units = ["", "uno", "due", "tre", "quattro", "cinque", "sei", "sette", "otto", "nove"];
    const tens = ["", "dieci", "venti", "trenta", "quaranta", "cinquanta", "sessanta", "settanta", "ottanta", "novanta"];
    const specials = ["dieci", "undici", "dodici", "tredici", "quattordici", "quindici", "sedici", "diciassette", "diciotto", "diciannove"];

    for (let i = 1; i < 100; i++) {
        let word = "";
        if (i < 10) word = units[i]; 
        else if (i < 20) word = specials[i - 10];
        else {
            let t = Math.floor(i / 10);
            let u = i % 10;
            let tenWord = tens[t];
            let unitWord = units[u];

            if ((u === 1 || u === 8) && tenWord.length > 0) tenWord = tenWord.slice(0, -1);

            word = tenWord + unitWord;
        }

        textToNumMap[word] = i;

        // Corretto: sostituisci solo "tre" finale
        if (word.endsWith("tre")) {
            textToNumMap[word.replace(/tre$/, "tré")] = i;
        }
    }

    textToNumMap["un"] = 1;
    textToNumMap["primo"] = 1;
    textToNumMap["cento"] = 100;
}

// \u0055\u006D\u0062\u0065\u0072\u0074\u006F \u0046\u002E \u004D\u002E \u0043\u0065\u0066\u0061\u006C\u00E0

// Stop brutale di tutto l'audio
function stopAllAudio() {
    if (speechSynthesis.speaking || speechSynthesis.pending) {
        speechSynthesis.cancel();
    }
    synthesisQueue = [];
    isSpeaking = false;
}

// Funzione per dividere testo lungo in frasi (Fix Android 15s bug)
function splitTextIntoChunks(text) {
    // Divide per punteggiatura mantenendo i separatori, o max caratteri
    const regex = /[^.!?\n]+[.!?\n]+/g;
    let chunks = text.match(regex);
    if (!chunks || chunks.length === 0) chunks = [text];
    
    // Ulteriore controllo lunghezza (max 180 chars per sicurezza)
    let finalChunks = [];
    chunks.forEach(c => {
        if (c.length > 180) {
            let parts = c.match(/.{1,180}(\s|$)/g) || [c];
            finalChunks.push(...parts);
        } else {
            finalChunks.push(c);
        }
    });
    return finalChunks;
}

function speak(text, onEndCallback = null, isEntry = false) {
    stopAllAudio(); // Interrompe eventuale parlato precedente
  
    if (!audioEnabled) {
        if (!isEntry) appendOutput("🔇 Assistente impostato su muto 🔇", "hint-text");
        if (onEndCallback) onEndCallback();
        return;
    }

    // Preparazione coda di lettura
    synthesisQueue = splitTextIntoChunks(text);
    isSpeaking = true;

    let chunkIndex = 0;

    function playNextChunk() {
        if (chunkIndex >= synthesisQueue.length || !isSpeaking) {
            isSpeaking = false;
            if (onEndCallback) onEndCallback();
            return;
        }

        const utter = new SpeechSynthesisUtterance(synthesisQueue[chunkIndex]);
        utter.lang = 'it-IT';
        utter.rate = 1.0; 

        utter.onend = () => {
            chunkIndex++;
            playNextChunk();
        };

        utter.onerror = (e) => {
            console.error("TTS Error", e);
            chunkIndex++;
            playNextChunk();
        };

        speechSynthesis.speak(utter);
    }

    playNextChunk();
}

function stopAndResetApp() {
   // 1. Ferma audio e sintesi vocale
    stopAllAudio();

    // 2. Ferma il riconoscimento vocale se attivo
    if (currentRecognition) {
        currentRecognition.onend = null; // Evita che onend riparta o dia errori
        currentRecognition.stop();
        currentRecognition = null;
    }

    // 3. Reset delle variabili di stato
    appState = "IDLE";
    tempMemory = {}; // Dimentica ricerche o liste precedenti
    lastMainOutput = ""; // blocca comando "Ripeti"

    out.innerHTML = ""; // Cancella tutto il testo precedente
 
    appendOutput("🗑️ Elimino gli input e termino l'ascolto", "listening-status");
  
}

function startListening() {
    // Se c'è un riconoscimento attivo, chiudilo pulito prima di riaprire
    if (currentRecognition) {
        try { currentRecognition.abort(); } catch(e){}
    }

    if (!('webkitSpeechRecognition' in window)) {
        appendOutput("⚠️ Browser non supportato. Utilizza Android con il browser Chrome.");
        return;
    }

    const r = new webkitSpeechRecognition();
    r.lang = "it-IT";
    r.interimResults = false; // Ottimizzazione CPU: elabora solo finale
    r.maxAlternatives = 1;
    r.continuous = false; //blocca riconoscimento continuo per ridurre cpu
  
  r.onstart = () => {
        setState(STATES.LISTENING);
          micBtn.classList.add('listening');
    
            // Rimuove la scritta "Attendo istruzioni"
        const tempStatus = document.getElementById('tempListeningStatus');
        if (tempStatus) tempStatus.remove();

        // Usa la classe speciale per poterlo rimuovere dopo

    };

   r.onresult = (event) => {
        // Rimuove la scritta "Attendo istruzioni"
        const tempStatus = document.getElementById('tempListeningStatus');
        if (tempStatus) tempStatus.remove();

       const text = event.results[0][0].transcript.toLowerCase().trim();

    r.stop();     
    setState(STATES.PROCESSING);

    handleSpeechInput(text);
    showAvailableCommands();
 
    };

    r.onerror = (event) => {
        if (event.error !== 'no-speech') appendOutput("⚠️ Microfono " + event.error);
    };

    r.onend = () => {
        micBtn.classList.remove('listening');
    if (appState === STATES.LISTENING) {
        setState(STATES.IDLE);
    }
    currentRecognition = null;
    };

   if (currentRecognition) return; //protezione se già attivo 
    currentRecognition = r;
    r.start();
}

/**
 * Gestisce l'input dell'utente (testo) quando si attende la scelta da una lista di ricerca.
 * L'utente può dire un numero, 'tutti' o 'annulla'.
 */
function handleSearchChoice(text) {
    const results = tempMemory.searchResults;

    // 1. ANNULLA
    if (negativeWords.some(w => text.includes(w))) {
        speak("Ricerca annullata.");
        appendOutput("❌ Ricerca annullata.");
        // Pulisci lo stato e la memoria
        tempMemory.searchResults = null;
        return setState(STATES.IDLE);
    }
    
    if (!results || results.length === 0) {
        // Fallback: se la lista è vuota (non dovrebbe succedere se lo stato è impostato correttamente)
        speak("Nessun risultato disponibile da scegliere.");
        return setState(STATES.IDLE);
    }

    // 2. LEGGI TUTTI
    if (affirmativeWords.some(w => text.includes(w) && (text.includes("tutti") || text.includes("tutto")))) {
        // La funzione readAllResults imposterà lo stato READING_ALL e poi tornerà a IDLE
        readAllResults(results, text); 
        tempMemory.searchResults = null; // Pulisci la memoria
        return; // Non tornare subito a IDLE, attendi la fine della lettura
    }

    // 3. SCELTA NUMERICA
    const number = parseNumber(text);
    if (number > 0 && number <= results.length) {
        const selectedIndex = number - 1;
        const selectedItem = results[selectedIndex];
        
        speak(`Hai scelto il numero ${number}.`);
        displayEntryDetails(selectedItem); // Mostra i dettagli
        speakEntry(selectedItem);         // Leggi il contenuto
        
        lastMainOutput = selectedItem.output;
        tempMemory.searchResults = null; // Pulisci la memoria
        return setState(STATES.IDLE);
    } 
    
    // 4. RICHIESTA NON RICONOSCIUTA
    speak("Per favore, scegli un numero valido o dì 'tutti' oppure 'annulla'.");
    appendOutput("❗ Scelta non valida. Riprova: un numero, 'tutti', o 'annulla'.");
    // Rimane nello stato AWAITING_SEARCH_CHOICE
}

function handleSpeechInput(text) {

    console.log("INPUT:", text, " | STATE:", appState);

    // Normalizzazione
    if (!text || typeof text !== "string") {
        speak("Non ho sentito nulla");
        appendOutput("Non ho sentito nulla");
        return;
    }

    text = text.toLowerCase().trim();

    /* ========================
       1. GESTIONE STATI SPECIALI
    ========================= */

    // --- SCEGLI UN RISULTATO (liste di ricerca) ---
    if (appState === STATES.AWAITING_SEARCH_CHOICE) {
        return handleSearchChoice(text);
    }

    // --- CONFERMA SALVATAGGIO FALLBACK ---
    if (appState === STATES.AWAITING_SAVE_CONFIRMATION) {
        return handleSaveConfirmation(text);
    }


    /* ========================
       2. STATO GENERALE (IDLE o PROCESSING)
    ========================= */

    // Da qui in poi gestiamo i comandi normali
    // e ogni comando, se valido, termina in IDLE
    setState(STATES.PROCESSING);

    /* ========== PRIORITÀ 1: WHATSAPP ========== */
    if (whatsappWords.some(w => text.startsWith(w))) {
        setStatusIcon('whatsapp');
        handleWhatsapp(text);
        return setState(STATES.IDLE);
    }

    /* ========== PRIORITÀ 2: SALVA / COPIA ========== */
    const saveCmd = copyWords.find(w => text.startsWith(w));
    if (saveCmd) {
        setStatusIcon('transcription');
        handleSaveCommand(text, saveCmd);
        return setState(STATES.IDLE);
    }

    /* ========== PRIORITÀ 3: RIPETI ========== */
    if (text === "ripeti") {
        if (lastMainOutput) {
            speak("Ripeto: " + lastMainOutput);
            appendOutput("Ripeto...");
        } else {
            speak("Nulla da ripetere");
            appendOutput("Nulla da ripetere");
        }
        return setState(STATES.IDLE);
    }

    /* ========== PRIORITÀ 4: LETTURA RANDOM / LEGGI ========== */
    if (readWords.some(w => text.startsWith(w))) {
        setStatusIcon('random');
        const ok = handleRead(text);
        return setState(STATES.IDLE);
    }

    /* ========== PRIORITÀ 5: METADATI (AUTORE/TITOLO) ========== */
    if (text.includes("autore") || text.includes("titolo")) {
        setStatusIcon('search');

        let type = text.includes("autore") ? "meta_author" : "meta_title";
        let query = text.replace(/.*(autore|titolo)\s+/i, "").trim();

        if (query) {
            handleMetadataSearch(type, query);
            // handleMetadataSearch passa automaticamente in AWAITING_SEARCH_CHOICE
            return;
        }
        return setState(STATES.IDLE);
    }

    /* ========== PRIORITÀ 6: RICERCA AVANZATA (cerca in X ...) ========== */
    const searchPattern = new RegExp(
        `(${searchVerbs.join('|')})\\s+(${searchPreps.join('|')})\\s+([a-zA-Z0-9_]+)\\s+(.*)`,
        'i'
    );

    const match = text.match(searchPattern);
    if (match) {
        setStatusIcon('search');
        const section = match[3].toLowerCase();
        const query = match[4].trim();

        if (archive[section]) {
            handleAdvancedSearch(section, query);
            // handleAdvancedSearch imposta AWAITING_SEARCH_CHOICE se serve
            return;
        }
    }

    /* ========== PRIORITÀ 7: TRIGGER DIRETTO ========== */
    let found = findEntryByTrigger(text);
    if (found) {
        setStatusIcon('conversation');
        displayEntryDetails(found);
        speakEntry(found);
        lastMainOutput = found.output;

        tempMemory.searchResults = null; // pulizia
        return setState(STATES.IDLE);
    }

    /* ========== PRIORITÀ 8: RICERCA GLOBALE FALLBACK ========== */
    handleGlobalSearchFallback(text);
    // fallback può entrare in AWAITING_SEARCH_CHOICE o AWAITING_SAVE_CONFIRMATION
}

/* ================== IMPLEMENTAZIONE FUNZIONI ================== */
// \u0055\u006D\u0062\u0065\u0072\u0074\u006F \u0046\u002E \u004D\u002E \u0043\u0065\u0066\u0061\u006C\u00E0

function findEntryByTrigger(text) {

    if (!text || typeof text !== "string") return null;
    text = text.toLowerCase();

    let bestMatch = null;
    let highestScore = 0;

    /* =======================================================
       1) PRIORITÀ ASSOLUTA: SEZIONE "conversazione"
       -------------------------------------------------------
       - prima si cerca in conversazione
       - ogni match della sezione conversazione vince su tutto
    ======================================================== */
    if (archive.conversazione && Array.isArray(archive.conversazione)) {
        for (const item of archive.conversazione) {
            if (!item.trigger) continue;

            const trg = item.trigger.toLowerCase();
            const score = scoreTriggerMatch(text, trg);

            if (score > highestScore) {
                highestScore = score;
                bestMatch = item;
            }
        }

        if (bestMatch) return bestMatch; // match trovato in conversazione
    }


    /* =======================================================
       2) SEZIONI NORMALI (tutte le altre)
    ======================================================== */
    for (let sec in archive) {
        if (sec === "conversazione") continue;

        for (const item of archive[sec]) {
            if (!item.trigger) continue;

            const trg = item.trigger.toLowerCase();
            const score = scoreTriggerMatch(text, trg);

            if (score > highestScore) {
                highestScore = score;
                bestMatch = item;
            }
        }
    }

    // ritorna il miglior candidato oppure null
    return bestMatch;
}

function handleWhatsapp(text) {

    console.log("WHATSAPP INPUT:", text);

    // Varianti WhatsApp
    const prefixes = [
        "whatsapp",
        "invia whatsapp",
        "manda whatsapp",
        "invia un whatsapp",
        "manda un whatsapp",
        "scrivi un whatsapp",
        "scrivi whatsapp"
    ];

    // 1) Rimuovo il prefisso
    let command = text;
    for (const p of prefixes) {
        if (command.startsWith(p)) {
            command = command.replace(p, "").trim();
            break;
        }
    }

    // Esempi formato:
    // "a luca: ciao come stai"
    // "per giulia manda questo messaggio: arrivo"
    // "a marco"
    // "a marco nota vocale"
    // "nota vocale a marco: ciao"

    /* ============================================================
       2) IDENTIFICO PERSONA E MESSAGGIO
    ============================================================ */

    // Possibili pattern indicativi
    const toRegex = /^(a|per)\s+([a-zA-Z0-9àèéìòùç ]+)(:|\s|$)/i; // "a luca", "per giulia"
    const colonSplit = command.split(":"); // es. "a luca: ciao"

    let person = null;
    let message = null;
    let isVoiceNote = false;


    /* ------------------------------------------------------------
       2A) Riconoscimento “nota vocale”
    ------------------------------------------------------------ */
    if (command.includes("nota vocale") || command.includes("vocale")) {
        isVoiceNote = true;
        command = command.replace("nota vocale", "")
                         .replace("vocale", "").trim();
    }


    /* ------------------------------------------------------------
       2B) Estrazione persona con pattern "a Luca"
    ------------------------------------------------------------ */
    const toMatch = command.match(toRegex);
    if (toMatch) {
        person = toMatch[2].trim();
        command = command.replace(toMatch[0], "").trim();
    }


    /* ------------------------------------------------------------
       2C) Estrazione messaggio dopo il “:”
    ------------------------------------------------------------ */
    if (!message && colonSplit.length > 1) {
        const rightSide = colonSplit.slice(1).join(":").trim();
        if (rightSide.length > 0) {
            message = rightSide;
        }
    }

    /* ------------------------------------------------------------
       2D) Se non c’è “:”, il resto della frase è il messaggio
    ------------------------------------------------------------ */
    if (!message && command && command.length > 0) {
        message = command.trim();
    }


    /* ============================================================
       3) GENERAZIONE PROMPT DI CONTROLLO
    ============================================================ */

    // Caso: manca la persona
    if (!person) {
        speak("A chi devo inviare il messaggio WhatsApp?");
        appendOutput("❓ Manca il destinatario.");
        return;
    }

    // Caso: manca il contenuto
    if (!message && !isVoiceNote) {
        speak(`Cosa devo dire a ${person}?`);
        appendOutput(`❓ Manca il contenuto del messaggio per ${person}.`);
        return;
    }


    /* ============================================================
       4) COSTRUZIONE BLOCCO PROMPT PER L'ASSISTANT
    ============================================================ */

    let actionType = isVoiceNote ? "voice_note" : "text_message";

    // Contenuto da mostrare
    let outputMsg = isVoiceNote
        ? `Nota vocale per ${person}`
        : `Messaggio per ${person}: ${message}`;

    appendOutput("📨 " + outputMsg);
    appendTrigger("whatsapp");


    /* ============================================================
       5) PROMPT PER L'ASSISTANT (chiaro e rigido)
    ============================================================ */

    let prompt = `
Prepara un messaggio WhatsApp.

Destinatario: ${person}
Tipo: ${isVoiceNote ? "NOTA VOCALE" : "MESSAGGIO TESTUALE"}
Contenuto: ${message ? message : "(detta nota vocale)"} 
`;

    // comunica all'assistente cosa deve fare
    speak(`Sto preparando il messaggio per ${person}.`);
    sendToAssistant(JSON.stringify({ action: "whatsapp_send", person, message, type: actionType }));
}

function handleAdvancedSearch(section, query) {
    console.log("ADVANCED SEARCH:", section, "| QUERY:", query);

    const list = archive[section];
    if (!list) {
        speak("La sezione indicata non esiste.");
        appendOutput("❌ Sezione inesistente: " + section);
        return;
    }

    // Normalizza query
    const q = query.toLowerCase().trim();

    // Filtra risultati
    const results = list.filter(item => {
        const t = (item.trigger || "").toLowerCase();
        const o = (item.output || "").toLowerCase();
        const mt = (item.meta_title || "").toLowerCase();
        const ma = (item.meta_author || "").toLowerCase();
        return t.includes(q) || o.includes(q) || mt.includes(q) || ma.includes(q);
    });

    /* ============================================================
       1) NESSUN RISULTATO
       ============================================================ */
    if (results.length === 0) {
        speak("Nessun risultato trovato in " + section);
        appendOutput(`❌ Nessun risultato in "${section}" per: ${query}`);
        return;
    }

    /* ============================================================
       2) UN SOLO RISULTATO
       ============================================================ */
    if (results.length === 1) {
        const item = results[0];

        displayEntryDetails(item);
        speakEntry(item);

        lastMainOutput = item.output;
        tempMemory.searchResults = null;

        setState(STATES.IDLE);
        return;
    }

    /* ============================================================
       3) MOLTI RISULTATI → attiva AWAITING_CHOICE
       ============================================================ */

    tempMemory.searchResults = results;
    setState(STATES.AWAITING_CHOICE);

    // Costruzione lista visiva (numerata)
    let visualList =
        `📋 Risultati trovati in "${section.toUpperCase()}" (${results.length} elementi):\n\n` +
        results
            .map((r, i) =>
                `${i + 1}. ${r.meta_title || r.trigger || "-"}`
            )
            .join("\n");

    appendOutput(visualList);
    lastMainOutput = visualList;

    // Costruzione parlato
    let verbal = `Ho trovato ${results.length} risultati in ${section}. `;
    results.forEach((r, i) => {
        verbal += `Numero ${i + 1}: ${r.meta_title || r.trigger || "voce senza titolo"}. `;
    });

    speak(verbal + "Quale numero vuoi leggere?");
    appendOutput("👉 Dimmi un numero oppure dì: tutti");
}

// =====================
// Funzione TTS asincrona
// =====================
function speakAsync(text) {
    return new Promise(resolve => {
        if (!text || !text.trim()) {
            resolve();
            return;
        }

        // Interrompe eventuale parlato in corso
        if (speechSynthesis.speaking || speechSynthesis.pending) {
            speechSynthesis.cancel();
        }

        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "it-IT";
        utter.rate = 1.0;

        utter.onend = () => resolve();
        utter.onerror = () => {
            console.error("TTS error in speakAsync()");
            resolve();
        };

        speechSynthesis.speak(utter);
    });
}

    // Avviso iniziale
    speak("Leggo tutti i risultati.");
    appendOutput("📖 Leggo tutti i risultati...");
    setState(STATES.READING_ALL);

    let combinedOutput = "";
    let counter = 1;

    for (const item of results) {
        // Output visivo
        const visualOut = `----------------
Numero: ${counter}
Titolo: ${item.meta_title || "-"}
Autore: ${item.meta_author || "-"}
Contenuto: ${item.output || "N/A"}
Ricerca: ${item.trigger || "N/A"}
Tag: ${item.tag || "-"}
----------------`;

        appendOutput(visualOut);
        combinedOutput += visualOut + "\n";

        // Output vocale
        const verbalText = `Numero ${counter}. ` +
            `${item.meta_title ? item.meta_title + ". " : ""}` +
            `${item.output || ""}`;

        await speakAsync(verbalText);
        await new Promise(r => setTimeout(r, 300)); // breve pausa
        counter++;
    }

    // Salvataggio output principale
    lastMainOutput = combinedOutput;

    // Pulizia risultati temporanei
    tempMemory.searchResults = null;

    // Feedback fine lettura
    speak("Ho finito di leggere tutti i risultati.");
    appendOutput("✅ Fine lettura di tutti i risultati.");

    // =====================
    // Gestione scelta numerica
    // =====================
    const choiceNum = parseNumber(userText);
    if (choiceNum !== null && choiceNum > 0 && choiceNum <= results.length) {
        const item = results[choiceNum - 1];

        displayEntryDetails(item);
        speakEntry(item);
        appendOutput(`Numero selezionato: ${choiceNum}`);
        lastMainOutput = item.output;

        // Non cancelliamo tempMemory subito se l'utente volesse altri comandi
        setState(STATES.IDLE);
    } else if (userText.match(/\d+/)) {
        // L'utente ha detto un numero fuori range
        speak("Numero non valido. Riprova");
        appendOutput("⚠️ Numero non valido. Riprova");
        setState(STATES.IDLE);
    } else {
        // Nessuna scelta numerica specifica: ritorna a IDLE
        setState(STATES.IDLE);
    }
}

function handleMetadataSearch(type, query) {
    const all = [].concat(...Object.values(archive));
    const results = all.filter(c => c[type] && c[type].toLowerCase().includes(query));
    
    if (results.length > 0) {
        tempMemory.searchResults = results;
        appState = "AWAITING_SEARCH_CHOICE";
        let out = `Trovati ${results.length} per ${query}. `;
        results.forEach((r, i) => out += `${i+1}: ${r.meta_title || r.trigger}. `);
      
        // Formattazione visiva con "a capo"
        let visualList = `📋 Risultati per "${query.toUpperCase()}":\n`;
        visualList += results.map((r,i) => `${i+1}. ${r.meta_title|| r.trigger || "-"}`).join("\n");
  
        appendOutput(visualList);
        lastMainOutput = visualList; // Permette di dire "Salva" per salvare la lista
      
        speak(out + " Quale leggo?");
        appendOutput("Quale leggo?");
    } else {
        speak("Nessun riscontro");
        appendOutput("Nessun riscontro");
    }
}

function handleGlobalSearchFallback(query) {
    let allResults = [];
    let resultsBySection = {};
    const q = query.toLowerCase().trim();

    // 1. Scansiona TUTTE le sezioni dell'archivio
    for (let section in archive) {
        // Filtra gli elementi che contengono la query in trigger, output, titolo o autore
        let matches = archive[section].filter(item => {
            const t = (item.trigger || "").toLowerCase();
            const o = (item.output || "").toLowerCase();
            const mt = (item.meta_title || "").toLowerCase();
            const ma = (item.meta_author || "").toLowerCase();
            return t.includes(q) || o.includes(q) || mt.includes(q) || ma.includes(q);
        });

        // Se ci sono match in questa sezione, salvali
        if (matches.length > 0) {
            resultsBySection[section] = matches;
            // Aggiungiamo alla lista piatta per permettere la selezione numerica (1, 2, 3...)
            allResults = allResults.concat(matches);
        }
    }

    // 2. NESSUN RISULTATO TROVATO
    if (allResults.length === 0) {
         tempMemory.pendingSaveText = query; // Salviamo il testo originale
         appState = "AWAITING_SAVE_CONFIRMATION";
         speak("Non ho capito e non ho trovato nulla");
         appendOutput("Non ho capito e non ho trovato nulla");
         appendOutput("Questo è quello che ho sentito: «" + query + "»");
         lastMainOutput = query; // Permette di dire "Salva" per salvare 
         return;
    }

    // 3. RISULTATI TROVATI: Costruiamo la risposta raggruppata
    // \u0055\u006D\u0062\u0065\u0072\u0074\u006F \u0046\u002E \u004D\u002E \u0043\u0065\u0066\u0061\u006C\u00E0

    tempMemory.searchResults = allResults; // Salviamo la lista per la scelta (es. "Numero 5")
    appState = "AWAITING_SEARCH_CHOICE";   // Attiviamo la modalità scelta

    let verbalOutput = `Ho trovato ${allResults.length} risultati`;
    let visualOutput = "";
    
    // Contatore globale unico (così l'utente dice "5" e non "3 della seconda sezione")
    let globalCounter = 1;

    for (let sec in resultsBySection) {
        // Aggiunge intestazione sezione al parlato e al testo
        verbalOutput += `Nella sezione ${sec}: `;
        visualOutput += `\n--- SEZIONE: ${sec.toUpperCase()} ---\n`;

        resultsBySection[sec].forEach(item => {
            // Cosa dire a voce: "Numero X: titolo o trigger"
            verbalOutput += `Numero ${globalCounter}: ${item.meta_title || item.trigger || "elemento senza nome"}. `;
            
            // Cosa scrivere a video
            visualOutput += `${globalCounter}. ${item.meta_title ? "Titolo: " + item.meta_title : item.trigger ? "Ricerca: " + item.trigger : "-"}\n`;
            
            globalCounter++;
        });
    }

    appendOutput(visualOutput);
    speak(verbalOutput + " Quale numero leggo?");
    lastMainOutput = visualOutput; // Permette di dire "Salva" per salvare la lista completa
    appendOutput("Quale numero leggo?");
  }

function formatText(str) {
    let s = str.trim();

    // 1. EMOJI vocali
    s = s.replace(/\bemoji\s+([\w\s]+)\b/gi, (match, key) => {
        key = key.toLowerCase().trim();
        return emojiMap[key] || match;
    });

    // 2. Punteggiatura vocale → simboli
    const punctuationMap = [
        { regex: /\bpunto interrogativo\b/gi, char: "?" },
        { regex: /\bpunto esclamativo\b/gi, char: "!" },
        { regex: /\bdue punti\b/gi, char: ":" },
        { regex: /\bvirgola\b/gi, char: "," },
        { regex: /\bpunto\b/gi, char: "." },
        { regex: /\ba capo\b/gi, char: "\n" }
    ];

    for (const p of punctuationMap) {
        s = s.replace(p.regex, p.char);
    }

    // 3. Normalizzazione spazi e punteggiatura
    s = s.replace(/\s+([,.!?])/g, "$1");  // niente spazio prima della punteggiatura
    s = s.replace(/([,.!?])(?=\S)/g, "$1 "); // assicura spazio dopo punteggiatura (tranne prima di newline)
    s = s.replace(/([,.!?])\s+\n/g, "$1\n"); // niente spazio prima delle newline
    s = s.replace(/\s*\n\s*/g, "\n");

    // 4. Capitalizzazione frasi
    s = s.replace(/(^|[.!?]\s+)([a-z])/g, (m, before, char) => before + char.toUpperCase());

    // 5. Capitalizzazione NOMI ITALIANI
    const nomiRegex = new RegExp(`\\b(${[...NOMI_ITALIANI].join("|")})\\b`, "gi");
    s = s.replace(nomiRegex, m => m.charAt(0).toUpperCase() + m.slice(1));

    // 6. Capitalizzazione CITTA ITALIANE
    const cittaRegex = new RegExp(`\\b(${[...CITTA_ITALIANE]
        .sort((a,b)=>b.length-a.length) // evita match parziali (es: "terme" in "Lamezia Terme")
        .join("|")
        .replace(/\s+/g, "\\s+")})\\b`, "gi");

    s = s.replace(cittaRegex, m =>
        m.split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ")
    );

    return s.trim();
}


function parseNumber(text) {
    if (!text) return null;
    let t = text.toLowerCase().replace(/[^\w ]/g, "");
    
    // Cerca cifre dirette
    const digitMatch = t.match(/\d+/);
    if (digitMatch) return parseInt(digitMatch[0]);

    // Cerca parole
    for (const [word, value] of Object.entries(textToNumMap)) {
        const regex = new RegExp(`\\b${word}\\b`, 'i');
        if (regex.test(t)) return value;
    }
    return null;
}

document.getElementById('importFile').onchange = (e) => {
    const r = new FileReader();
    r.onload = ev => {
        try {
            const j = JSON.parse(ev.target.result);
            // Merge intelligente
            for (let k in j) {
                if (!archive[k]) archive[k] = [];
                j[k].forEach(i => archive[k].push(i));
            }
            localStorage.setItem('archive', JSON.stringify(archive));
            updateSectionList();
            appendOutput("Import completato.");
        } catch(e) { appendOutput("Errore file JSON."); }
    };
    if (e.target.files[0]) r.readAsText(e.target.files[0]);
};
