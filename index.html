/* ================== AUDIO & TTS ================== */
// \u0055\u006D\u0062\u0065\u0072\u0074\u006F \u0046\u002E \u004D\u002E \u0043\u0065\u0066\u0061\u006C\u00E0
function stopAllAudio() {
    speechSynthesis.cancel();
    synthesisQueue = [];
}

function speak(text) {
    stopAllAudio();
    if (!audioEnabled || !text) return;
    
    // Divide testo lungo per evitare blocchi su Android
    const chunks = text.match(/.{1,160}(\s|$)/g) || [text];
    
    let i = 0;
    function playNext() {
        if (i >= chunks.length) return;
        const u = new SpeechSynthesisUtterance(chunks[i]);
        u.lang = 'it-IT';
        u.onend = () => { i++; playNext(); };
        u.onerror = () => { i++; playNext(); };
        speechSynthesis.speak(u);
    }
    playNext();
}

/* ================== MICROFONO & CORE LOGIC ================== */
// \u0055\u006D\u0062\u0065\u0072\u0074\u006F \u0046\u002E \u004D\u002E \u0043\u0065\u0066\u0061\u006C\u00E0
const micBtn = document.getElementById('micButton');

function setState(newState) {
    appState = newState;
    micBtn.classList.remove('listening');
    if (newState === STATES.LISTENING) micBtn.classList.add('listening');
    
    // Reset icona se torniamo in IDLE
    if (newState === STATES.IDLE) document.getElementById('statusIconContainer').textContent = "";
}

function startListening() {
    if (currentRecognition) currentRecognition.abort();
    if (!('webkitSpeechRecognition' in window)) return alert("Usa Chrome.");

    const r = new webkitSpeechRecognition();
    r.lang = "it-IT";
    r.interimResults = false;
    r.maxAlternatives = 1;

    r.onstart = () => {
        setState(STATES.LISTENING);
        appendOutput("⏳ Attendo istruzioni", "temp-status");
    };

    r.onresult = (e) => {
        const text = e.results[0][0].transcript.toLowerCase().trim();
        document.querySelectorAll('.temp-status').forEach(el => el.remove());
        handleSpeechInput(text);
    };

    r.onerror = (e) => {
        if (e.error !== 'no-speech') appendOutput("⚠️ Errore microfono: " + e.error);
        setState(STATES.IDLE);
    };

    r.onend = () => {
        // Se non stiamo processando, torna in IDLE
        if (appState === STATES.LISTENING) setState(STATES.IDLE);
    };

    currentRecognition = r;
    r.start();
}

micBtn.onclick = () => {
   if (appState === STATES.SPEAKING || speechSynthesis.speaking) {
        stopAllAudio();
        startListening();
        return;
    }
   if (appState === STATES.LISTENING) {
        if (currentRecognition) currentRecognition.stop();
        return;
    }

};
 

document.getElementById('stopButton').onclick = () => {

    if (currentRecognition) {

function handleSpeechInput(text) {
    setState(STATES.PROCESSING);

    // 1. Gestione Stati Speciali (Attesa Risposta)
    if (appState === STATES.AWAITING_CHOICE) {

    if (text.startsWith("invia whatsapp") || text.startsWith("whatsapp")) {
        const content = text.replace(/^(invia\s*)?whatsapp\s*(a\s*)?/i, "").trim();
        handleWhatsapp(content);
        return setState(STATES.IDLE);

   // --- WHATSAPP invio input già registrato ---

        speak("Non ho nulla"); 
        return setState(STATES.IDLE);
    }

  
    // --- NUOVO: MESSAGGIO (Con Emoji Automatiche) ---
    if (text.startsWith("messaggio")) {
        let content = text.replace(/^messaggio\s*/i, "").trim();
        if (!content) {
            speak("Messaggio vuoto.");
            return setState(STATES.IDLE);

        // Salviamo in conversazione

        speak("Messaggio creato: " + formatted);
        appendOutput(`<b>Messaggio:</b> ${formatted}`);
        return setState(STATES.IDLE);
    }

    // --- SALVA / TRASCRIVI (Standard, NO Emoji) ---
    const saveWords = ["salva", "trascrivi", "scrivi", "copia", "memorizza"];
    const saveCmd = saveWords.find(w => text.startsWith(w));
    if (saveCmd) {
        let content = text.replace(new RegExp(`^${saveCmd}\\s*`, "i"), "").trim();
        if (!content) {
            speak("Cosa devo scrivere?");
            return setState(STATES.IDLE);
        }
        // Qui DISATTIVIAMO le emoji automatiche (false)
        const formatted = formatText(content, false);
        
        saveToArchive(formatted, "Nota Rapida");
        speak("Ho salvato la nota.");
        appendOutput(`💾 <b>Salvato:</b> ${formatted}`);
        return setState(STATES.IDLE);
    }

    // --- RIPETI ---
    if (text === "ripeti") {
        speak("Non ho nulla da ripetere al momento."); // Semplificato
        return setState(STATES.IDLE);
    }

    // --- RICERCA NELL'ARCHIVIO ---
    const found = findBestMatch(text);
    const __s = atob("VW1iZXJ0b19GX0F1dG9yZV8yMDI1");
    
    if (found && found.score > 0.85) {

        displayEntry(found.item);

        return setState(STATES.IDLE);
    } else {
        // Ricerca fuzzy o Fallback
        const results = searchArchive(text);
        handleSearchResults(results, text);
        // handleSearchResults imposta lo stato corretto
    }
}

/* ================== IMPLEMENTAZIONE FUNZIONI ================== */
// \u0055\u006D\u0062\u0065\u0072\u0074\u006F \u0046\u002E \u004D\u002E \u0043\u0065\u0066\u0061\u006C\u00E0
function formatText(str, autoEmoji) {
    let s = str.trim();

    // 1. Emoji Automatiche (Solo se richiesto)
    if (autoEmoji) {
        // Sostituisce le parole intere presenti nella mappa
        const regex = new RegExp(`\\b(${Object.keys(emojiMap).join("|")})\\b`, "gi");
        s = s.replace(regex, (match) => emojiMap[match.toLowerCase()] || match);
    }

  // Punteggiatura vocale → simboli
    const punctuationMap = [
        { regex: /\bpunto interrogativo\b/gi, char: "?" },
        { regex: /\bpunto esclamativo\b/gi, char: "!" },
        { regex: /\bdue punti\b/gi, char: ":" },
        { regex: /\bvirgola\b/gi, char: "," },
        { regex: /\bpunto\b/gi, char: "." },
        { regex: /\ba capo\b/gi, char: "\n" }
    ];

    for (const p of punctuationMap) {
        s = s.replace(p.regex, p.char);
    }

    // Normalizzazione spazi e punteggiatura
    s = s.replace(/\s+([,.!?])/g, "$1");  // niente spazio prima della punteggiatura
    s = s.replace(/([,.!?])(?=\S)/g, "$1 "); // assicura spazio dopo punteggiatura (tranne prima di newline)
    s = s.replace(/([,.!?])\s+\n/g, "$1\n"); // niente spazio prima delle newline
    s = s.replace(/\s*\n\s*/g, "\n");

    // Capitalizzazione frasi
    s = s.replace(/(^|[.!?]\s+)([a-z])/g, (m, before, char) => before + char.toUpperCase());

    // Capitalizzazione NOMI ITALIANI
    const nomiRegex = new RegExp(`\\b(${[...NOMI_ITALIANI].join("|")})\\b`, "gi");
    s = s.replace(nomiRegex, m => m.charAt(0).toUpperCase() + m.slice(1));

    // Capitalizzazione CITTA ITALIANE
    const cittaRegex = new RegExp(`\\b(${[...CITTA_ITALIANE]
        .sort((a,b)=>b.length-a.length) // evita match parziali (es: "terme" in "Lamezia Terme")
        .join("|")
        .replace(/\s+/g, "\\s+")})\\b`, "gi");

    // Formattazione del saluto (Buongiorno/Ciao/Buonasera + nomi)
    s = s.replace(
    /\b(Buongiorno|Ciao|Buonasera)\s+((?:[A-Z][a-z]+(?:\s+)?)+)/g,
    (m, saluto, nomi) => {
        nomi = nomi.trim();
        return `${saluto} ${nomi},\n`;
    }
   );

  
    s = s.replace(cittaRegex, m =>
        m.split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ")
    );

 return s;
  
}

function handleWhatsapp(text) {
    if (text.length < 2) {
        speak("Cosa devo inviare?");
        return;
    }
    const msg = formatText(text, true) + "\n //_trascritto dall'Assistente Vocale_";
    const url = `whatsapp://send?text=${encodeURIComponent(msg)}`;
    window.open(url, '_self');
    appendOutput(`💬 Apertura WhatsApp: "${msg}"`);
}

function saveToArchive(text, type) {
    archive.conversazione.push({
        trigger: text.toLowerCase().substring(0, 20),
        output: text,
        meta_title: type,
        date: new Date().toLocaleTimeString()
    });
    localStorage.setItem('archive', JSON.stringify(archive));
    updateSectionList();
}

// Logica di Ricerca
function findBestMatch(text) {
    let best = null;
    let maxScore = 0;
    
    // Cerca in tutte le sezioni
    Object.keys(archive).forEach(sec => {
        archive[sec].forEach(item => {
            if (!item.trigger) return;
            // Punteggio semplice: inclusione
            let score = 0;
            const t = item.trigger.toLowerCase();
            if (text === t) score = 1.0;
            else if (text.includes(t)) score = 0.9;
            else if (t.includes(text) && text.length > 3) score = 0.7;
            
            if (score > maxScore) { maxScore = score; best = item; }
        });
    });
    return { item: best, score: maxScore };
}

function searchArchive(query) {
    let results = [];
    Object.keys(archive).forEach(sec => {
        archive[sec].forEach(item => {
            if ((item.trigger && item.trigger.includes(query)) || (item.output && item.output.includes(query))) {
                results.push(item);
            }
        });
    });
    return results;
}

function handleSearchResults(results, query) {
    if (results.length === 0) {
        speak("Nessun risultato. Vuoi salvare questo testo?");
        appendOutput(`Nessun risultato per "${query}". Lo devo salvare?`);
        tempMemory.pendingText = query;
        setState(STATES.AWAITING_CONFIRM);
    } else if (results.length === 1) {
        displayEntry(results[0]);
        speak(results[0].output);
        setState(STATES.IDLE);
    } else {
        tempMemory.results = results;
        let list = results.map((r, i) => `${i+1}. ${r.meta_title || r.trigger}`).join("\n");
        appendOutput(`📋 Trovati ${results.length} risultati:\n${list}\n\n👉 Scegli un numero o dì 'Tutti'.`);
        speak(`Ho trovato ${results.length} risultati. Scegli un numero o dì tutti.`);
        setState(STATES.AWAITING_CHOICE);
    }
}

// Gestione Scelte Successive
function handleChoiceInput(text) {
    if (text.includes("annulla")) {
        speak("Annullato.");
        appendOutput("❌ Annullato.");
        return setState(STATES.IDLE);
    }

    if (text.includes("tutti")) {
        const fullText = tempMemory.results.map(r => r.output).join(". ");
        speak("Leggo tutto: " + fullText);
        appendOutput("📖 Lettura completa...");
        return setState(STATES.IDLE);
    }

    // Parsing numero (parola o cifra)
    let num = parseInt(text.replace(/\D/g, ''));
    if (isNaN(num)) {
        for (let w in textToNumMap) if (text.includes(w)) num = textToNumMap[w];
    }

    if (num > 0 && num <= tempMemory.results.length) {
        const item = tempMemory.results[num - 1];
        displayEntry(item);
        speak(item.output);
        setState(STATES.IDLE);
    } else {
        speak("Numero non valido. Riprova.");
    }
}

function handleConfirmInput(text) {
    if (text.includes("salva")) {
        const formatted = formatText(tempMemory.pendingText, false);
        saveToArchive(formatted, "Da Ricerca Fallita");
        speak("Salvato.");
        appendOutput("✅ Salvato in conversazione.");
    } else {
        speak("Non salvato.");
        appendOutput("❌ Operazione annullata.");
    }
    tempMemory = {};
    setState(STATES.IDLE);
}

/* ================== UTILITIES UI ================== */
function displayEntry(item) {
    appendOutput(`📌 <b>${item.meta_title || item.trigger}</b>\n${item.output}`);
}

function appendOutput(html, className) {
    const d = document.createElement('div');
    d.innerHTML = html;
    if (className) d.className = className;
    d.style.marginBottom = "0.625rem";
    const out = document.getElementById('output');
    out.appendChild(d);
    out.scrollTop = out.scrollHeight;
}

function updateSectionList() {
    const counts = Object.keys(archive).map(k => `${k} (${archive[k].length})`).join(" | ");
    document.getElementById('sectionsList').textContent = "Archivio: " + counts;
}
updateSectionList();

document.getElementById('toggleButtons').onclick = () => {
    const el = document.getElementById('extraButtons');
    el.style.display = el.style.display === 'block' ? 'none' : 'block';
};

document.getElementById('resetArchive').onclick = () => {
    if(confirm("Cancello tutto?")) {
        archive = JSON.parse(JSON.stringify(defaultArchive));
        localStorage.setItem('archive', JSON.stringify(archive));
        updateSectionList();
        appendOutput("🗑️ Archivio svuotato.");
    }
};

document.getElementById('exportCommands').onclick = () => {
    const a = document.createElement('a');
    a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(archive, null, 2));
    a.download = "backup_assistente.json"; a.click();
};

document.getElementById('importFile').onchange = (e) => {
    const r = new FileReader();
    r.onload = ev => {
        try {
            const j = JSON.parse(ev.target.result);
            Object.keys(j).forEach(k => {
                if(!archive[k]) archive[k] = [];
                archive[k] = archive[k].concat(j[k]);
            });
            localStorage.setItem('archive', JSON.stringify(archive));
            updateSectionList();
            appendOutput("📥 Dati importati.");
        } catch(err) { alert("File non valido"); }
    };
    if (e.target.files[0]) r.readAsText(e.target.files[0]);
};

document.getElementById('muteButton').onclick = () => {
    audioEnabled = !audioEnabled;
    const btn = document.getElementById('muteButton');
    btn.className = audioEnabled ? "mute-on" : "";
    btn.textContent = audioEnabled ? "🔈" : "🔇";
    if(!audioEnabled) stopAllAudio();
};
</script>
